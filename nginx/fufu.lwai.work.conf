# 傅傅的工作台 · 域名反代配置
# 用法（在 VPS 上）：
#   1) 安装 nginx + certbot： apt install -y nginx certbot python3-certbot-nginx
#   2) 把本文件放到 /etc/nginx/sites-available/fufu.lwai.work.conf
#      并软链： ln -s /etc/nginx/sites-available/fufu.lwai.work.conf /etc/nginx/sites-enabled/
#      （或放到 /etc/nginx/conf.d/fufu.lwai.work.conf）
#   3) 先在 .env 里保留 APP_PORT=3000（容器 3000 不动），本配置反代到 127.0.0.1:3000
#   4) nginx -t && systemctl reload nginx
#   5) 申请免费证书（自动改写本文件加 443 + 跳转）：
#      certbot --nginx -d fufu.lwai.work
#   6) 阿里云安全组需放行 TCP 80 与 443（443 用于 HTTPS 访问，必须放行）；
#      docker-compose 已不再映射 80（交由本 nginx 监听），仅保留 3000 直连（可选）。
#
# 说明：server.js 读取 X-Forwarded-Proto 决定是否给登录 Cookie 加 Secure；
#      本配置已透传，HTTP 下 Cookie 不带 Secure（可正常登录），HTTPS 下自动带 Secure。

server {
    listen 80;
    listen [::]:80;
    server_name fufu.lwai.work;

    # 证书申请期（certbot HTTP-01 校验）需要能访问到 /.well-known，反代即可。
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 必须：HTTP 时为 http，HTTPS 时为 https
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # —— 文件库上传大文件（如 300MB 视频）需要放宽请求体上限与超时；证书申请期同样保留 ——
        client_max_body_size 512M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

