<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>傅傅的工作台</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#1f2733; --muted:#7a869a;
    --line:#e8ebf2; --line2:#eef1f7; --brand:#4f46e5; --brand-soft:#eef0ff;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
    --radius:14px;
  }
  /* 访问密码门 */
  #gate{position:fixed;inset:0;background:linear-gradient(135deg,#eef0ff,#f5f6fa);display:none;align-items:center;justify-content:center;z-index:9999;}
  #gate.show{display:flex;}
  .gate-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:34px 30px;width:320px;max-width:90vw;text-align:center;}
  .gate-logo{font-size:40px;}
  .gate-card h2{margin:10px 0 4px;font-size:20px;color:var(--ink);}
  .gate-sub{margin:0 0 18px;color:var(--muted);font-size:13px;}
  #gatePwd{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;}
  #gatePwd:focus{border-color:var(--brand);}
  #gateBtn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  #gateBtn:hover{opacity:.92;}
  .gate-err{margin-top:12px;color:#e11d48;font-size:13px;min-height:16px;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:268px; flex:0 0 268px; background:#0f172a; color:#cbd5e1;
    padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px;}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6); font-size:20px;
  }
  .brand .name{font-size:16px;font-weight:700;color:#fff;line-height:1.2;}
  .brand .sub{font-size:11px;color:#64748b;}
  .nav{margin-top:6px;}
  .nav-group{margin-bottom:4px;}
  .nav-head{
    display:flex;align-items:center;gap:9px; padding:9px 10px; border-radius:10px;
    cursor:pointer; user-select:none; font-size:14px; color:#cbd5e1; transition:.15s;
  }
  .nav-head:hover{background:#1e293b;}
  .nav-head .ic{font-size:16px;width:20px;text-align:center;}
  .nav-head .arrow{margin-left:auto; transition:.2s; font-size:11px; color:#64748b;}
  .nav-group.collapsed .arrow{transform:rotate(-90deg);}
  .nav-group.collapsed .nav-items{display:none;}
  .nav-items{padding:2px 0 4px 14px; margin-left:10px; border-left:1px solid #1e293b;}
  .nav-item{
    display:flex;align-items:center;gap:9px; padding:7px 10px; border-radius:9px;
    font-size:13px; color:#94a3b8; cursor:pointer; transition:.15s;
  }
  .nav-item:hover{background:#1e293b; color:#e2e8f0;}
  .nav-item.active{background:var(--brand); color:#fff; font-weight:600;}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7;}

  /* Main */
  .main{flex:1; min-width:0; padding:26px 30px 60px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .crumb b{color:var(--ink);}
  .page-title{font-size:23px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;}
  .page-title .tag{font-size:12px;font-weight:600;color:#fff;background:var(--brand);padding:3px 10px;border-radius:999px;}
  .page-hint{font-size:13px;color:var(--muted);margin-top:4px;}
  .date-pill{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);}

  /* Cards / grid */
  .grid{display:grid;gap:16px;}
  .cols-2{grid-template-columns:repeat(2,1fr);}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card .h .t{font-weight:700;font-size:15px;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px;border:1.5px dashed var(--line);border-radius:12px;}

  /* Buttons */
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 15px;border-radius:10px;background:var(--brand);color:#fff;transition:.15s;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--brand-soft);color:var(--brand);}
  .btn.soft{background:#f1f3f9;color:var(--ink);}
  .btn.mini{padding:5px 10px;font-size:12px;border-radius:8px;}
  .btn.danger{background:#fee2e2;color:#dc2626;}

  /* Item cards */
  .item{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;transition:.15s;}
  .item:hover{border-color:#d7ddf0;box-shadow:0 4px 14px rgba(20,30,60,.05);}
  .item .it-title{font-weight:650;font-size:14.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .item .meta{font-size:12.5px;color:var(--muted);line-height:1.7;}
  .item .meta b{color:#475069;font-weight:600;}
  .item .ops{position:absolute;top:11px;right:11px;display:flex;gap:6px;opacity:0;transition:.15s;}
  .item:hover .ops{opacity:1;}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin:3px 4px 0 0;}
  .item .chips{margin-top:2px;}
  .chip.cat{background:#fff1e6;color:#d97706;}
  .chip.tag{background:#e0f2fe;color:#0ea5e9;}
  .chip.emo{background:#fdeaf3;color:#db2777;}
  .chip.type{background:#eaf1ff;color:#2563eb;}
  .chip.scene{background:#eafaf1;color:#16a34a;}
  .chip.kw{background:#f1f3f8;color:#64748b;}
  .chip.sub{background:#f5f0ff;color:#7c3aed;}
  .item .quote{margin:8px 0;padding:9px 13px;border-left:3px solid var(--brand);background:#fbfaff;border-radius:0 9px 9px 0;font-size:13px;color:#3a3f55;line-height:1.65;font-style:italic;}
  .item .snippet{margin:6px 0 2px;padding:7px 11px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;line-height:1.6;}
  .item .snippet b{color:#b45309;}
  .item mark{background:#fff1a8;color:#7c2d12;padding:0 2px;border-radius:3px;font-weight:600;}
  .item .meta.orig{background:#f8fafc;padding:8px 11px;border-radius:9px;max-height:120px;overflow:auto;}
  .item .meta.muted{color:#9aa3b2;}

  /* article input form */
  .article-form{padding:6px 2px 4px;}
  .article-form label{display:block;font-size:12.5px;font-weight:600;color:#475069;margin:14px 0 6px;}
  .article-form label .req{color:#ef4444;margin-left:2px;}
  .article-form .inp,.article-form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;outline:none;transition:.15s;box-sizing:border-box;}
  .article-form .inp:focus,.article-form textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .article-form textarea{resize:vertical;line-height:1.65;}
  .article-form .form-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}
  .article-form .hint-box{margin-top:16px;padding:12px 14px;background:#f5f3ff;border:1px solid #e9e5ff;border-radius:10px;font-size:12.5px;color:#5b4db2;line-height:1.65;}
  .multi-toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#475069;cursor:pointer;user-select:none;}
  .multi-toggle input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;}
  .multi-toggle input:checked + span{color:var(--brand);}

  /* progress */
  .prog{height:8px;background:#eef1f7;border-radius:999px;overflow:hidden;margin-top:9px;}
  .prog > span{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);}
  .prog-label{font-size:12px;color:var(--muted);margin-top:5px;}

  /* todo */
  .todo{display:flex;align-items:center;gap:12px;background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;}
  .todo.done{opacity:.55;}
  .todo.done .todo-text{text-decoration:line-through;}
  .check{width:21px;height:21px;border-radius:7px;border:2px solid #c7cde0;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:.15s;}
  .check.on{background:var(--brand);border-color:var(--brand);color:#fff;font-size:13px;}
  .todo-text{flex:1;font-size:14px;}
  .inline-add{display:flex;gap:9px;margin-top:6px;}
  .inline-add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .inline-add input:focus{border-color:var(--brand);}

  /* todo 卡片式 */
  .todo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px;margin-top:12px;}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .tcard.done{opacity:.6;background:#f8fafc;}
  .tcard.done .tcontent{text-decoration:line-through;}
  .tcard-top{display:flex;align-items:center;gap:9px;}
  .tcheck{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto;transition:.15s;}
  .tcheck.on{background:#22c55e;border-color:#22c55e;}
  .tcontent{width:100%;border:none;resize:vertical;font-family:inherit;font-size:14px;line-height:1.55;min-height:44px;background:transparent;outline:none;color:#0f172a;}
  .tcontent:focus{background:#f1f5f9;border-radius:8px;padding:6px 8px;}
  .tdeadline{display:flex;align-items:center;gap:7px;font-size:12px;color:#64748b;}
  .tdeadline input{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;color:#334155;background:#f8fafc;}
  .tnote{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.55;min-height:50px;resize:vertical;background:#f8fafc;color:#334155;outline:none;}
  .tnote:focus{background:#fff;border-color:#93c5fd;}
  .itype{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12px;color:#334155;background:#f8fafc;max-width:175px;}
  .itype:focus{border-color:#93c5fd;background:#fff;}

  /* 愿望清单（列表式：输入框 + 许愿按钮 + 每行愿望 + 勾选实现） */
  .wish-add{display:flex;gap:9px;margin-top:4px;}
  .wish-add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .wish-add input:focus{border-color:var(--brand);}
  .btn.primary{background:var(--brand);color:#fff;border:none;}
  .btn.primary:hover{filter:brightness(1.05);}
  .wish-list{margin-top:14px;display:flex;flex-direction:column;}
  .wish-item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;transition:background .12s;}
  .wish-item:hover{background:#f8fafc;}
  .wish-check{width:18px;height:18px;flex:0 0 auto;cursor:pointer;accent-color:var(--brand);margin:0;}
  .wish-text{flex:1;font-size:15px;color:#0f172a;line-height:1.5;word-break:break-word;}
  .wish-item.done .wish-text{text-decoration:line-through;color:#94a3b8;}
  .wish-date{flex:0 0 auto;font-size:12px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .wish-del{flex:0 0 auto;opacity:0;border:none;background:transparent;color:#cbd5e1;font-size:19px;cursor:pointer;line-height:1;padding:0 6px 2px;border-radius:6px;transition:.12s;}
  .wish-item:hover .wish-del{opacity:1;}
  .wish-del:hover{color:#dc2626;background:#fee2e2;}

  /* todos 三板块：添加行 + 只读态 */
  .todo-add{display:flex;gap:9px;margin-top:4px;align-items:center;}
  .todo-add .ti{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .todo-add .ti:focus{border-color:var(--brand);}
  .todo-add input[type=date]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:#334155;}
  .tdeadline input[readonly], .tnote[readonly]{background:#f1f5f9;color:#94a3b8;cursor:default;resize:none;}

  /* habits */
  .habit{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
  .habit .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .habit .nm{font-weight:650;font-size:14.5px;}
  .streak{font-size:12px;color:var(--muted);}
  .streak b{color:#10b981;}
  .days{display:flex;gap:7px;}
  .day{flex:1;text-align:center;}
  .day .dlabel{font-size:10.5px;color:var(--muted);margin-bottom:5px;}
  .day .cell{height:30px;border-radius:9px;background:#eef1f7;cursor:pointer;display:grid;place-items:center;font-size:13px;transition:.12s;}
  .day .cell.on{background:#10b981;color:#fff;}

  /* review */
  textarea.note{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:inherit;font-size:14px;line-height:1.75;outline:none;resize:vertical;background:#fff;color:var(--ink);}
  textarea.note:focus{border-color:var(--brand);}
  .review-list{margin-top:16px;}
  .review-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;cursor:pointer;background:#fbfcfe;}
  .review-item:hover{border-color:#d7ddf0;}
  .review-item .rd{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .review-item .rs{font-size:13.5px;color:#475069;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* dashboard stat cards */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;}
  .stat:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,30,60,.1);}
  .stat .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .stat .num{font-size:30px;font-weight:800;margin-top:8px;line-height:1;}
  .stat .desc{font-size:12px;color:var(--muted);margin-top:6px;}

  /* 录入表待处理提醒框 */
  .pending-banner{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);transition:.15s;}
  .pending-banner.warn{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;cursor:pointer;}
  .pending-banner.warn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(234,88,12,.12);}
  .pending-banner.ok{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;cursor:default;}
  .pending-banner .pb-ic{font-size:30px;flex:0 0 auto;line-height:1;}
  .pending-banner .pb-txt{font-size:14px;color:#475069;line-height:1.65;}
  .pending-banner.warn .pb-txt b{color:#ea580c;font-size:20px;font-weight:800;margin:0 2px;}
  .pending-banner .pb-link{color:var(--brand);font-weight:600;}

  /* 灵感库：筛选 + 搜索工具栏 */
  .wisdom-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px;align-items:center;}
  .wisdom-toolbar .inp{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;outline:none;font-family:inherit;box-sizing:border-box;}
  .wisdom-toolbar .inp:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .wisdom-toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-family:inherit;color:#475069;outline:none;max-width:160px;cursor:pointer;}
  .wisdom-toolbar select:focus{border-color:#a5b4fc;}
  /* 搜索框 + 搜索按钮并排；输入不打断，点击/回车才筛选 */
  .wisdom-toolbar .search-wrap{display:flex;gap:8px;flex:1;min-width:260px;}
  .wisdom-toolbar .search-wrap .inp{flex:1;min-width:0;}
  .wisdom-toolbar .search-wrap .btn{flex:0 0 auto;padding:9px 16px;white-space:nowrap;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .wisdom-toolbar .search-wrap .btn:hover{opacity:.92;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:min(460px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#475069;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);
  /* ---------- 类 Excel 表格 ---------- */
  .grid-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);}
  .grid-scroll{overflow:auto;padding:14px;}
  table.xls{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff;}
  table.xls td.xc{border:1px solid #cbd5e1;padding:0;vertical-align:top;min-width:96px;height:36px;background:#fff;position:relative;}
  table.xls td.xc .xc-t{padding:7px 9px;min-height:20px;white-space:pre-wrap;word-break:break-word;outline:none;font-size:13.5px;line-height:1.5;}
  table.xls td.xc.sel{background:#dbeafe;box-shadow:inset 0 0 0 2px #3b82f6;}
  table.xls td.xc .xc-t.editing{background:#fffbe6;box-shadow:inset 0 0 0 1px #f59e0b;}
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);}
  .field textarea{min-height:84px;resize:vertical;}
  /* 灵感库详情：原始文案上移并加宽一倍（弹窗整体加宽） */
  .modal.wide{width:min(720px,100%);}
  .field.fullw textarea{min-height:220px;font-size:14px;line-height:1.7;}
  /* 每日日记：4 个分类/标签下拉 2×2 布局 */
  .cat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:6px 0 2px;}
  .cat-row .field{margin-bottom:0;}
  .modal-ops{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .muted{color:var(--muted);}
  /* 年计划：年份切换 + 四列可调整高度 + 添加 */
  .annual-yearbar{display:flex;align-items:center;gap:16px;margin:6px 0 16px;}
  .annual-yearbar .yr{flex:1;text-align:center;font-size:25px;font-weight:800;letter-spacing:1px;color:var(--ink);}
  .annual-yearbar .yrbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);transition:.15s;flex:0 0 auto;}
  .annual-yearbar .yrbtn:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
  .annual-summary{width:100%;min-height:96px;resize:vertical;margin-bottom:6px;}
  .annual-rows{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .annual-row{position:relative;display:flex;gap:14px;align-items:stretch;}
  .annual-col{flex:1 1 0;min-width:0;resize:none;overflow:auto;line-height:1.6;font-size:14px;}
  .annual-resize{position:absolute;left:0;right:0;bottom:-8px;height:14px;cursor:ns-resize;z-index:2;}

/* ---------- build sidebar ---------- */
const navEl = document.getElementById('nav');
function buildNav(){
  let html='';
  NAV.forEach(g=>{
    if(g.children){
      html += `<div class="nav-group" data-g="${g.id}">
        <div class="nav-head" onclick="toggleGroup('${g.id}')">
          <span class="ic">${g.icon}</span><span>${g.label}</span><span class="arrow">▾</span>
        </div><div class="nav-items">`;
      g.children.forEach(c=>{
        html += `<div class="nav-item" data-id="${c.id}" onclick="go('${c.id}')"><span class="dot"></span>${c.label}</div>`;
      });
      html += `</div></div>`;
    } else {
      html += `<div class="nav-item" data-id="${g.id}" onclick="go('${g.id}')" style="margin:2px 0 6px"><span class="ic" style="width:20px;text-align:center">${g.icon}</span>${g.label}</div>`;
    }
  });
  navEl.innerHTML = html;
}
function toggleGroup(id){
  const g = document.querySelector(`.nav-group[data-g="${id}"]`);
  g.classList.toggle('collapsed');
}
buildNav();

/* ---------- routing ---------- */
let current = 'dashboard';
function go(id){
  current = id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  render();
}
function crumbPath(id){
  if(id==='dashboard') return ['首页'];
  for(const g of NAV){
    if(g.id===id) return [g.label];
    if(g.children){
      const c = g.children.find(x=>x.id===id);
      if(c) return [g.label, c.label];
    }
  }
  return [id];
}
function setHeader(id){
  const cr = crumbPath(id);
  document.getElementById('crumb').innerHTML = cr.map((c,i)=> i===cr.length-1?`<b>${c}</b>`:`<span>${c}</span> / `).join('');
  let title='', hint='', accent='#4f46e5';
  if(id==='dashboard'){ title='工作台首页'; hint='你的个人运营中枢 · 一屏掌握全局'; }
  else { const s=SECTIONS[id]; title=s.name; hint=s.hint; accent=s.accent; }
  document.getElementById('pageTitle').innerHTML = title + (id!=='dashboard'?`<span class="tag" style="background:${accent}">${id.toUpperCase().slice(0,4)}</span>`:'');
  document.getElementById('pageHint').textContent = hint;
  document.getElementById('datePill').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
}

/* ---------- modal ---------- */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function openModal(title, schema, values, onSave){
  values = values||{};
  let fields = schema.map(f=>{
    const v = values[f.key]!=null?values[f.key]:(f.default!=null?f.default:'');
    if(f.type==='textarea') return `<div class="field"><label>${f.label}</label><textarea data-k="${f.key}">${esc(v)}</textarea></div>`;
    if(f.type==='select'){
      const opts = (f.options||[]).map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
      return `<div class="field"><label>${f.label}</label><select data-k="${f.key}">${opts}</select></div>`;
    }
    const min = f.min!=null?`min="${f.min}"`:'', max=f.max!=null?`max="${f.max}"`:'';
    return `<div class="field"><label>${f.label}</label><input data-k="${f.key}" type="${f.type==='number'?'number':'text'}" value="${esc(v)}" ${min} ${max}/></div>`;
  }).join('');
  modal.innerHTML = `<h3>${title}</h3>${fields}
    <div class="modal-ops">
      <button class="btn soft" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitModal()">保存</button>
    </div>`;
  modal._schema = schema; modal._onSave = onSave; modal._values = values;
  overlay.classList.add('show');
}
function closeModal(){ overlay.classList.remove('show'); modal.classList.remove('wide'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
async function submitModal(){
  const schema = modal._schema, vals = modal._values;
  const out = Object.assign({}, vals);
  for(const f of schema){
    const el = modal.querySelector(`[data-k="${f.key}"]`);
    let v = el.value;
    if(f.type==='number') v = v===''?0:Number(v);
    out[f.key]=v;
    if(f.required && !String(v).trim()){ alert('请填写：'+f.label); return; }
  }
  try{ await modal._onSave(out); }catch(e){ alert('保存失败：'+(e&&e.message||e)); return; }
  closeModal();
}

/* ---------- generic list renderer ---------- */
async function renderList(sectionId, kind){
  const s = SECTIONS[sectionId];

  try{ arr = await apiList(sectionId); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }
  cache[sectionId] = arr;
  let html = `<div class="card"><div class="h"><div class="t">${s.name}（${arr.length}）</div>`;
  if(!s.readonly) html += `<button class="btn" onclick="addGeneric('${sectionId}')">+ 添加</button>`;
  html += `</div>`;

  html += '<div class="grid cols-2">';

      inner += `<button class="btn danger mini" onclick="delGeneric('${sectionId}','${it.id}')">删除</button>`;
      ops = `<div class="ops">${inner}</div>`;
    }
    let body = genericBody(kind,it);
    html += `<div class="item">${ops}${body}</div>`;
  });
  html += '</div></div>';

}
function genericBody(kind,it){
  const fields = SCHEMA[kind];
  let title = it.title || it.name || '(无标题)';
  let head = `<div class="it-title">${esc(title)}</div>`;
  let meta = '';
  fields.forEach(f=>{
    if(f.key==='title') return;
    let v = it[f.key]; if(v==null||v==='') return;
    if(f.key==='tags'){ meta += (v.split(',').map(t=>`<span class="chip">${esc(t.trim())}</span>`).join('')); return; }
    if(f.key==='content'||f.key==='detail'||f.key==='note'||f.key==='result'){ meta += `<div class="meta">${esc(v)}</div>`; return; }
    meta += `<div class="meta"><b>${f.label}：</b>${esc(v)}</div>`;
  });
  let prog = '';
  if(kind==='goals'){
    const p = Number(it.progress)||0;
    prog = `<div class="prog"><span style="width:${p}%"></span></div><div class="prog-label">${p}% 完成</div>`;
  }
  return head+meta+prog;
}
/* 灵感库卡片：展示核心字段 + 搜索高亮 + 命中片段（q 由调用方传入当前页搜索词） */
function hl(s, q){
  s = s||'';
  if(!q) return esc(s);
  const safe = esc(s);
  const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try { return safe.replace(new RegExp(qe,'gi'), x=>`<mark>${x}</mark>`); }
  catch(e){ return safe; }
}
// 命中片段：若命中词只藏在「关键词/AI总结/标签/分类」等卡片上看不到的字段，补一行片段让用户看清
function wisdomMatchInfo(it, q){
  q = (q||'').trim();
  if(!q) return {hit:true, snippet:''};
  const ql = q.toLowerCase();
  const fields = {
    title:(it.title||''), quote:(it.quote||''), keywords:(it.keywords||''),
    summary:(it.summary||''), tag:(it.tag||''), cat1:(it.cat1||''),
    cat2:(it.cat2||''), cat3:(it.cat3||'')
  };
  const hay = Object.values(fields).join(' ').toLowerCase();
  if(!hay.includes(ql)) return {hit:false};
  if(fields.title.toLowerCase().includes(ql) || fields.quote.toLowerCase().includes(ql)) return {hit:true, snippet:''};
  if(fields.summary.toLowerCase().includes(ql)){
    const i = fields.summary.toLowerCase().indexOf(ql);
    return {hit:true, snippet: fields.summary.slice(Math.max(0,i-12), i+ql.length+24)};
  }
  if(fields.keywords.toLowerCase().includes(ql)) return {hit:true, snippet: fields.keywords};
  return {hit:true, snippet: [fields.tag,fields.cat1,fields.cat2,fields.cat3].filter(Boolean).join(' / ')};
}
function wisdomBody(it, q){
  let h = `<div class="it-title">${hl(it.title||'(无标题)', q)}</div>`;
  let chips = '';
  if(it.cat1) chips += `<span class="chip cat">${esc(it.cat1)}</span>`;
  if(it.tag) chips += `<span class="chip tag">${esc(it.tag)}</span>`;
  if(it.ctype) chips += `<span class="chip type">${esc(it.ctype)}</span>`;
  if(chips) h += `<div class="chips">${chips}</div>`;
  if(it.quote) h += `<div class="quote">“${hl(it.quote, q)}”</div>`;
  const m = wisdomMatchInfo(it, q);
  if(q && m.snippet) h += `<div class="snippet">🔎 命中：<b>${esc(m.snippet)}</b></div>`;
  return h;
}

async function loadMoreInsp(sectionId, isReset){
  const st = pgGet(sectionId);
  if(!document.getElementById('inspGrid')) return;   // 已切换到其它页面，放弃
  if(st.loading || st.done) return;
  st.loading = true;
  const loader = document.getElementById('inspLoader'); if(loader) loader.style.display='block';
  try{
    const data = await fetchInspPage(sectionId, st.page + 1);
    st.facets = data.facets || st.facets || {};
    const tw = document.getElementById('inspToolbarWrap'); if(tw) tw.innerHTML = inspToolbar(sectionId);
    st.items = isReset ? data.items.slice() : st.items.concat(data.items);
    st.page = data.page; st.total = data.total; st.hasMore = data.hasMore; st.done = !data.hasMore;
    renderInspGrid(sectionId);
  }catch(e){ alert('加载失败：'+(e.message||e)); }
  finally{
    st.loading = false;
    const l2 = document.getElementById('inspLoader'); if(l2) l2.style.display='none';
  }
  // 内容不足一屏却还有更多 → 继续加载（避免滚不动就拿不到后续数据）
  if(st.hasMore && !st.done && document.documentElement.scrollHeight <= window.innerHeight + 60){
    setTimeout(()=> loadMoreInsp(sectionId, false), 60);
  }
}

  const end = document.getElementById('inspEnd'); if(end) end.style.display = (st.done && st.items.length) ? 'block' : 'none';
}
function setupInspScroll(sectionId){
  if(_infiniteScrollFn){ window.removeEventListener('scroll', _infiniteScrollFn); _infiniteScrollFn = null; }

    if(!document.getElementById('inspGrid')) return;   // 离开了灵感库类页面

}

/* ---------- todos（三板块：今日待办 / 未完事项 / 已完成） ---------- */
// 把飞书回传的截止时间（UTC 毫秒或字符串）归一为 datetime-local 值 "YYYY-MM-DDTHH:MM"
function fmtDeadline(v){
  if(!v) return '';
  if(typeof v === 'number'){
    const d = new Date(v + 8*3600*1000), p = n => (n<10?'0'+n:''+n);
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}T${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  }
  return String(v).replace(' ','T').slice(0,16);
}
// 北京时间今天的 YYYY-MM-DD（与截止时间显示口径一致）
function todayStr(){
  const d = new Date(Date.now() + 8*3600*1000), p = n => (n<10?'0'+n:''+n);
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}
const datePart = s => s ? String(s).slice(0,10) : '';
const isOverdue = (t, td) => { const d = datePart(t.deadline); return d !== '' && d < td; };
async function renderTodos(){
  let arr;
  try{ arr = await apiList('todos'); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }
  cache.todos = arr;
  arr.forEach(t => { if (t.deadline) t.deadline = fmtDeadline(t.deadline); });
  const td = todayStr();
  const todayList   = arr.filter(t => !t.done && !isOverdue(t, td)); // 今日待办（含今日及未来）
  const overdueList = arr.filter(t => !t.done &&  isOverdue(t, td)); // 未完事项（已逾期）
  const doneList    = arr.filter(t => t.done);                        // 已完成
  let html = '';
  // —— 板块一：今日待办 ——
  html += `<div class="card">
    <div class="h"><div class="t">今日待办 <span class="muted" style="font-weight:500">· 待完成 ${todayList.length}</span></div></div>
    <div class="todo-add">
      <input id="todoInput" class="ti" placeholder="输入待办内容，回车添加…" onkeydown="if(event.key==='Enter')addTodo()"/>
      <input type="date" id="todoDeadline" value="${td}">
      <button class="btn primary" onclick="addTodo()">添加待办</button>
    </div>
    <div class="todo-grid">`;
  if(!todayList.length) html += `<div class="empty" style="grid-column:1/-1">还没有待办，上面添加一条吧 ✅</div>`;
  todayList.forEach(t => html += todoCard(t, 'today'));
  html += `</div></div>`;
  // —— 板块二：未完事项（不显示勾选框）——
  html += `<div class="card">
    <div class="h"><div class="t">未完事项 <span class="muted" style="font-weight:500">· 已逾期 ${overdueList.length}</span></div></div>
    <div class="todo-grid">`;
  if(!overdueList.length) html += `<div class="empty" style="grid-column:1/-1">🎉 没有逾期事项</div>`;
  overdueList.forEach(t => html += todoCard(t, 'overdue'));
  html += `</div></div>`;
  // —— 板块三：已完成（只读，仅勾选框可取消）——
  html += `<div class="card">
    <div class="h"><div class="t">已完成 <span class="muted" style="font-weight:500">· 共 ${doneList.length} 条</span></div></div>
    <div class="todo-grid">`;
  if(!doneList.length) html += `<div class="empty" style="grid-column:1/-1">还没有已完成的事项</div>`;
  doneList.forEach(t => html += todoCard(t, 'done'));
  html += `</div></div>`;
  view.innerHTML = html;
}
function todoCard(t, mode){
  const did = t.id, dp = datePart(t.deadline);
  const showCheck = (mode==='today' || mode==='done');   // 未完事项不显示勾选框
  const ro = (mode==='done');                            // 已完成：截止时间/备注只读、无删除
  const check = showCheck
    ? `<div class="tcheck ${t.done?'on':''}" onclick="toggleTodo('${did}')" title="完成/取消">✓</div>`
    : '';
  const del = (mode!=='done')
    ? `<button class="btn danger mini" style="margin-left:auto" onclick="delTodo('${did}')">删</button>`
    : '';
  const deadline = ro
    ? `<input type="date" value="${dp}" readonly>`
    : `<input type="date" value="${dp}" onchange="saveTodoField('${did}','deadline',this.value)">`;
  const title = ro
    ? `<textarea class="tcontent" placeholder="待办内容…" readonly>${esc(t.title||'')}</textarea>`
    : `<textarea class="tcontent" placeholder="待办内容…" onblur="saveTodoField('${did}','title',this.value)">${esc(t.title||'')}</textarea>`;
  const note = ro
    ? `<textarea class="tnote" placeholder="备注…" readonly>${esc(t.note||'')}</textarea>`
    : `<textarea class="tnote" placeholder="备注…" onblur="saveTodoField('${did}','note',this.value)">${esc(t.note||'')}</textarea>`;
  return `<div class="tcard ${t.done?'done':''}" id="tcard-${did}">
    <div class="tcard-top">
      ${check}
      <span class="muted" style="font-size:12px">⏰ ${dp||'无截止'}</span>
      ${del}
    </div>
    ${title}
    <div class="tdeadline"><span>截止</span>${deadline}</div>
    ${note}
  </div>`;
}
async function addTodo(){
  const i=document.getElementById('todoInput'), d=document.getElementById('todoDeadline');
  const v=(i?i.value:'').trim();
  const dl=(d?d.value:'') || todayStr();
  if(!v){ if(i) i.focus(); return; }
  try{
    const r = await apiCreate('todos',{title:v,done:false,date:dl,deadline:dl,note:''});
    await renderTodos();
  }catch(e){ alert('添加失败：'+(e.message||e)); }
}
async function toggleTodo(id){
  const t=(cache.todos||[]).find(x=>x.id===id); if(!t) return;
  t.done=!t.done;
  if(t.done){
    // 标记完成：在备注最前面加一行完成时间
    const now=new Date(), p=n=>('0'+n).slice(-2);
    const ts=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
    t.note = (t.note && t.note.trim()) ? ('完成时间：'+ts+'\n'+t.note) : ('完成时间：'+ts);
    t.date = datePart(t.deadline) || todayStr();
  }else{
    t.note = (t.note||'').replace(/^完成时间：.*\n?/, '');   // 取消完成：移除自动添加的完成时间行
  }
  try{ await apiUpdate('todos', id, t); await renderTodos(); }
  catch(e){ alert('更新失败：'+(e.message||e)); }
}
async function saveTodoField(id, field, value){
  const t=(cache.todos||[]).find(x=>x.id===id); if(!t) return;
  if(field==='title') t.title=value;
  else if(field==='deadline'){ t.deadline=value; t.date=datePart(value)||todayStr(); }
  else if(field==='note') t.note=value;
  try{ await apiUpdate('todos', id, t); await renderTodos(); }
  catch(e){ alert('保存失败：'+(e.message||e)); }
}
async function delTodo(id){
  if(!confirm('删除这条待办？')) return;
  try{ await apiDelete('todos', id); cache.todos=(cache.todos||[]).filter(x=>x.id!==id); await renderTodos(); }
  catch(e){ alert('删除失败：'+(e.message||e)); }
}

/* ---------- habits ---------- */
function lastNDays(n){ const out=[]; const d=new Date(); for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); out.push(x.toISOString().slice(0,10)); } return out; }
function streakOf(hist){ let s=0; const d=new Date(); for(let i=0;;i++){ const x=new Date(d); x.setDate(d.getDate()-i); const k=x.toISOString().slice(0,10); if(hist&&hist[k]) s++; else { if(i===0){ continue; } break; } } return s; }
async function renderHabits(){
  let arr;
  try{ arr = await apiHabits(); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }

    <div class="inline-add" style="margin:0;width:auto"><input id="habitInput" placeholder="新增习惯名称…" style="padding:7px 11px"/>
    <button class="btn" onclick="addHabit()">+ 习惯</button></div></div>`;
  if(!arr.length){ html += `<div class="empty">还没有习惯，添加一个开始坚持吧 🌱</div></div>`; view.innerHTML=html; return; }
  arr.forEach(h=>{
    const st = streakOf(h.history);
    let cells='';
    days.forEach(dy=>{
      const on = h.history && h.history[dy];
      const lbl = new Date(dy).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}).replace('/','/');
      cells += `<div class="day"><div class="dlabel">${lbl}</div><div class="cell ${on?'on':''}" onclick="toggleHabit('${h.id}','${dy}')">${on?'✓':''}</div></div>`;

      <div style="display:flex;gap:10px;align-items:center"><span class="streak">🔥 连续 <b>${st}</b> 天</span>
      <button class="btn danger mini" onclick="delHabit('${h.id}')">删除</button></div></div>
      <div class="days">${cells}</div></div>`;
  });
  html += '</div>';
  view.innerHTML = html;
}

let diaryYear = new Date().getFullYear();

function diaryPaint(){
  const s = SECTIONS['diary'];
  const y = diaryYear, m = diaryMonth;
  const today = todayStr();
  const todayEntry = diaryData.find(d => d.date === today);
  diaryTodayDone = !!todayEntry;
  diarySelWeather = ''; diarySelMood = '';

  // —— 本月日历（右上角）——
  const startWeekday = (new Date(y, m-1, 1).getDay() + 6) % 7; // 周一=0
  const daysInMonth = new Date(y, m, 0).getDate();
  const ym = `${y}-${String(m).padStart(2,'0')}`;
  const byDate = {};
  diaryData.forEach(d => { if (d.date.slice(0,7) === ym) byDate[d.date] = d; });
  let cells = '';
  for (let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"><span class="ph"></span></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${ym}-${String(d).padStart(2,'0')}`;

    mainHTML = `<div class="diary-done">

    </div>`;
  } else {
    mainHTML = `<div class="diary-write">
      <div class="dw-meta">
        <div class="dw-date"><span class="dd-k">📅 日期</span><b>${today}</b><span class="muted">（不可修改）</span></div>
        <div class="dw-picks">
          <div class="pick"><div class="pick-label">天气</div><div class="wrow" id="wrow">${DIARY_WEATHER.map(w=>`<button class="wchip" onclick="pickWeather('${esc(w)}')">${w}</button>`).join('')}</div></div>
          <div class="pick"><div class="pick-label">今日心情</div><div class="mrow" id="mrow">${DIARY_MOOD.map(md=>`<button class="mchip" onclick="pickMood('${esc(md)}')">${md}</button>`).join('')}</div></div>
        </div>

  view.innerHTML = `<div class="card diary-card">

/* ---------- 年计划（按年份：四列可调整高度 + 添加） ---------- */
let annualYear = new Date().getFullYear();
let annualLoadedYear = null;          // annualState 实际所属的年份（防止把旧年数据写进新年份）
let annualState = { summary: '', rows: [] };
let annualSaveTimer = null;
let annualGen = 0;                    // 加载代次，丢弃过期加载结果，防止快速切换串数据
let annualDirty = false;              // 是否有未保存改动（避免无改动时也发 PUT）
const annualCache = {};               // year -> 已加载状态，用于秒切回看、不再请求
function annualMarkDirty(){ annualDirty = true; }
async function annualSave(flush){
  clearTimeout(annualSaveTimer);
  const doit = async () => {
    // 关键守卫：只有「当前显示年份 == 已加载年份」才落库，杜绝竞态下旧年数据写进新年份
    if(annualYear !== annualLoadedYear) return;
    const y = annualYear;
    const snap = JSON.parse(JSON.stringify(annualState));
    try {
      await apiJson('/annual?year='+y, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({data: snap})});
      annualDirty = false;
      annualCache[y] = snap;
    } catch(e){ console.warn('年计划保存失败', e); }
  };
  if(flush) return doit();
  annualSaveTimer = setTimeout(doit, 800);
}
async function renderAnnual(){
  annualYear = new Date().getFullYear();
  await annualLoad(annualYear);
}
async function annualLoad(year){
  const gen = ++annualGen;
  annualYear = year;
  // 命中缓存且本地无未保存改动：立即渲染，零网络等待（解决切换卡顿）
  if(annualCache[year] && !annualDirty){
    annualState = annualCache[year];
    annualLoadedYear = year;
    annualPaint();
    return;
  }
  // 否则展示加载态后再请求
  view.innerHTML = `<div class="card"><div class="annual-yearbar">
    <button class="yrbtn" onclick="annualSwitch(-1)" title="上一年">‹</button>
    <div class="yr">${year} 年计划</div>
    <button class="yrbtn" onclick="annualSwitch(1)" title="下一年">›</button>
  </div><div class="empty">加载中…</div></div>`;
  try {
    const data = await apiJson('/annual?year='+year);
    if(gen !== annualGen) return;            // 已有更新的加载，丢弃本次结果（防竞态）
    const st = (data && Array.isArray(data.rows)) ? data : { summary:'', rows:[] };
    if(st.summary == null) st.summary = '';
    annualState = st; annualLoadedYear = year; annualDirty = false;
    annualCache[year] = JSON.parse(JSON.stringify(st));
    annualPaint();
  } catch(e){
    if(gen !== annualGen) return;
    view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`;
  }
}
function annualRowsHTML(){
  if(!annualState.rows.length) return `<div class="muted" style="font-size:13px;padding:6px 2px">还没有任何计划，点击下方「添加」开始 ✨</div>`;
  return annualState.rows.map((row,r)=>{
    const h = row.h || 140;
    const cols = (row.c||[]).map((v,c)=>`<textarea class="inp annual-col" data-r="${r}" data-c="${c}" oninput="annualCellInput(this)" style="height:${h}px">${esc(v)}</textarea>`).join('');
    return `<div class="annual-row" data-r="${r}" style="height:${h}px">${cols}<div class="annual-resize" onmousedown="annualResizeStart(event,${r})"></div></div>`;
  }).join('');
}
function annualPaint(){
  const s = SECTIONS['annual'];
  let html = `<div class="card"><div class="h"><div class="t">${s.name}</div></div>`;
  html += `<div class="annual-yearbar">
    <button class="yrbtn" onclick="annualSwitch(-1)" title="上一年">‹</button>
    <div class="yr">${annualYear} 年计划</div>
    <button class="yrbtn" onclick="annualSwitch(1)" title="下一年">›</button>
  </div>`;
  html += `<textarea class="inp annual-summary" placeholder="年度总结 / 备注……" oninput="annualSummaryInput(this.value)">${esc(annualState.summary)}</textarea>`;
  html += `<div class="annual-rows" id="annualRows">${annualRowsHTML()}</div>`;
  html += `<div class="annual-add"><button class="btn primary" onclick="annualAddRow()">＋ 添加</button></div>`;
  html += `</div>`;
  view.innerHTML = html;
}
function annualSummaryInput(v){ annualState.summary = v; annualMarkDirty(); annualSave(); }
function annualCellInput(el){
  const r = +el.dataset.r, c = +el.dataset.c;
  if(!annualState.rows[r]) return;
  if(!annualState.rows[r].c) annualState.rows[r].c = ['','','',''];
  annualState.rows[r].c[c] = el.value;
  annualMarkDirty(); annualSave();
}
function annualAddRow(){
  annualState.rows.push({ c:['','','',''], h:140 });
  const box = document.getElementById('annualRows');
  if(box) box.innerHTML = annualRowsHTML();
  annualMarkDirty(); annualSave();
}
async function annualSwitch(delta){
  await annualSave(true);
  await annualLoad(annualYear + delta);
  window.scrollTo(0, 0);
}
let annualResizing = null;
function annualResizeStart(e, r){
  e.preventDefault();
  const rowEl = e.target.closest('.annual-row');
  if(!rowEl) return;
  annualResizing = { r, startY: e.clientY, startH: (annualState.rows[r] && annualState.rows[r].h) || 140, rowEl, curH: (annualState.rows[r] && annualState.rows[r].h) || 140 };
  document.addEventListener('mousemove', annualResizingMove);
  document.addEventListener('mouseup', annualResizeEnd);
}
function annualResizingMove(e){
  if(!annualResizing) return;
  let h = annualResizing.startH + (e.clientY - annualResizing.startY);
  if(h < 60) h = 60; if(h > 800) h = 800;
  annualResizing.curH = h;
  annualResizing.rowEl.style.height = h + 'px';
  annualResizing.rowEl.querySelectorAll('.annual-col').forEach(t => t.style.height = h + 'px');
}
function annualResizeEnd(){
  if(!annualResizing) return;
  annualState.rows[annualResizing.r].h = annualResizing.curH;
  document.removeEventListener('mousemove', annualResizingMove);
  document.removeEventListener('mouseup', annualResizeEnd);
  annualResizing = null;
  annualMarkDirty(); annualSave();
}

/* ---------- 类 Excel 表格编辑器（年计划 / 月计划） ---------- */
let gridSectionId = null;
let gridState = null;        // {rows, cols, data:[[{t,rs,cs}]]}
let gridSel = null;          // {r1,c1,r2,c2}
let gridSelecting = false;

function gCell(t){ return { t: (t==null?'':String(t)), rs:1, cs:1 }; }
function gBlank(rows,cols){ const d=[]; for(let r=0;r<rows;r++){ const row=[]; for(let c=0;c<cols;c++) row.push(gCell('')); d.push(row); } return d; }
function gNorm(g){
  g=g||{}; g.rows=Number(g.rows)||6; g.cols=Number(g.cols)||4; g.data=Array.isArray(g.data)?g.data:[];
  for(let r=0;r<g.rows;r++){ if(!g.data[r]) g.data[r]=[]; for(let c=0;c<g.cols;c++){ const x=g.data[r][c]||{}; g.data[r][c]={t:x.t==null?'':String(x.t), rs:Number(x.rs)||1, cs:Number(x.cs)||1}; } g.data[r].length=g.cols; }
  g.data.length=g.rows; return g;
}
function gNormSel(){ if(!gridSel) return null; const {r1,c1,r2,c2}=gridSel; return {r1:Math.min(r1,r2),c1:Math.min(c1,c2),r2:Math.max(r1,r2),c2:Math.max(c1,c2)}; }
function gInSel(r,c){ const s=gNormSel(); return s && r>=s.r1&&r<=s.r2&&c>=s.c1&&c<=s.c2; }

async function renderGrid(sectionId){
  const s = SECTIONS[sectionId];
  gridSectionId = sectionId;
  let g;
  try{ g = await apiJson('/grid/'+sectionId); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }
  gridState = gNorm(g && g.data ? g : {rows:6,cols:4,data:gBlank(6,4)});
  gridSel = null;
  let html = `<div class="card"><div class="h"><div class="t">${s.name}</div></div>`;
  html += `<div class="grid-toolbar">
    <button class="btn" onclick="gridAddRow()">＋ 行</button>
    <button class="btn" onclick="gridAddCol()">＋ 列</button>
    <button class="btn soft" onclick="gridDelRow()">删除行</button>
    <button class="btn soft" onclick="gridDelCol()">删除列</button>
    <button class="btn" onclick="gridMerge()">合并单元格</button>
    <button class="btn" onclick="gridSplit()">拆分单元格</button>
    <button class="btn primary" onclick="gridSave()">💾 保存</button>
    <span class="muted" style="font-size:12px;margin-left:6px">单击选中 · 拖动框选 · 双击单元格编辑文字</span>
  </div>`;
  html += `<div class="grid-scroll"><table class="xls" id="xls">${gTableHTML()}</table></div></div>`;
  view.innerHTML = html;
  bindGrid();
}
function gTableHTML(){
  const g = gridState; const covered = {};
  let h = '<tbody>';
  for(let r=0;r<g.rows;r++){
    h += '<tr>';
    for(let c=0;c<g.cols;c++){
      const key = r+'-'+c; if(covered[key]) continue;
      const cl = g.data[r][c] || gCell('');
      const rs = Math.min(cl.rs||1, g.rows-r);
      const cs = Math.min(cl.cs||1, g.cols-c);
      for(let i=0;i<rs;i++) for(let j=0;j<cs;j++){ if(i!==0||j!==0) covered[(r+i)+'-'+(c+j)] = true; }
      const sel = gInSel(r,c) ? ' sel' : '';
      h += `<td class="xc${sel}" data-r="${r}" data-c="${c}" rowspan="${rs}" colspan="${cs}"><div class="xc-t">${esc(cl.t)}</div></td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody>';
}
function paintGrid(){ const t = document.getElementById('xls'); if(t) t.innerHTML = gTableHTML(); paintSel(); }
function paintSel(){ const t = document.getElementById('xls'); if(!t) return; t.querySelectorAll('td.xc').forEach(td=>{ const r=+td.dataset.r,c=+td.dataset.c; td.classList.toggle('sel', !!gInSel(r,c)); }); }
function bindGrid(){
  const t = document.getElementById('xls'); if(!t) return;
  let start=null;
  t.addEventListener('mousedown', e=>{
    const td = e.target.closest('td'); if(!td) return;
    if(td.isContentEditable || (e.target.closest('.xc-t') && e.target.closest('.xc-t').isContentEditable)) return;
    e.preventDefault();
    start = { r:+td.dataset.r, c:+td.dataset.c };
    gridSel = { r1:start.r, c1:start.c, r2:start.r, c2:start.c };
    gridSelecting = true; paintSel();
  });
  t.addEventListener('mouseover', e=>{
    if(!gridSelecting || !start) return;
    const td = e.target.closest('td'); if(!td) return;
    gridSel = { r1:start.r, c1:start.c, r2:+td.dataset.r, c2:+td.dataset.c };
    paintSel();
  });
  document.addEventListener('mouseup', ()=>{ gridSelecting=false; });
  t.addEventListener('dblclick', e=>{
    const td = e.target.closest('td'); if(!td) return;
    gEditCell(td);
  });
}
function gEditCell(td){
  const r=+td.dataset.r, c=+td.dataset.c;
  const div = td.querySelector('.xc-t'); if(!div) return;
  div.setAttribute('contenteditable','true'); div.classList.add('editing'); div.focus();
  const range=document.createRange(); range.selectNodeContents(div);
  const seln=window.getSelection(); seln.removeAllRanges(); seln.addRange(range);
  const finish=()=>{ div.removeAttribute('contenteditable'); div.classList.remove('editing'); gridState.data[r][c].t = div.innerText.replace(/\n+$/,''); div.removeEventListener('blur',finish); div.removeEventListener('keydown',onKey); };
  const onKey=ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); div.blur(); } else if(ev.key==='Escape'){ ev.preventDefault(); div.blur(); } };
  div.addEventListener('blur',finish); div.addEventListener('keydown',onKey);
}
function gridAddRow(){ const g=gridState; g.data.push(Array.from({length:g.cols},()=>gCell(''))); g.rows++; paintGrid(); }
function gridAddCol(){ const g=gridState; g.data.forEach(row=>row.push(gCell(''))); g.cols++; paintGrid(); }
function gridDelRow(){ const s=gNormSel(); if(!s){ alert('请先选中要删除的行'); return; } const g=gridState; const keep=[]; for(let r=0;r<g.rows;r++){ if(r<s.r1||r>s.r2) keep.push(g.data[r]); } g.data=keep; g.rows=keep.length; paintGrid(); }
function gridDelCol(){ const s=gNormSel(); if(!s){ alert('请先选中要删除的列'); return; } const g=gridState; g.data.forEach(row=>row.splice(s.c1, s.c2-s.c1+1)); g.cols=g.data[0]?g.data[0].length:0; paintGrid(); }
function gridMerge(){
  const s=gNormSel(); if(!s || (s.r1===s.r2 && s.c1===s.c2)){ alert('请先框选一个大于 1 个单元格的区域再合并'); return; }
  const g=gridState; const txt=[];
  for(let r=s.r1;r<=s.r2;r++) for(let c=s.c1;c<=s.c2;c++){ const t=g.data[r][c].t; if(t&&t.trim()) txt.push(t.trim()); }
  for(let r=s.r1;r<=s.r2;r++) for(let c=s.c1;c<=s.c2;c++) g.data[r][c]=gCell('');
  g.data[s.r1][s.c1] = { t: txt.join(' / '), rs:s.r2-s.r1+1, cs:s.c2-s.c1+1 };
  gridSel = { r1:s.r1, c1:s.c1, r2:s.r1, c2:s.c1 }; paintGrid();
}
function gridSplit(){ const s=gNormSel(); if(!s){ alert('请先选中要拆分的合并单元格'); return; } const g=gridState; for(let r=s.r1;r<=s.r2;r++) for(let c=s.c1;c<=s.c2;c++){ const cl=g.data[r][c]; if(cl.rs>1||cl.cs>1){ cl.rs=1; cl.cs=1; } } paintGrid(); }
async function gridSave(){
  try{ await apiJson('/grid/'+gridSectionId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({grid:gridState})}); alert('已保存 ✅'); }
  catch(e){ alert('保存失败：'+(e.message||e)); }
}

    pendingBanner = `<div class="pending-banner ok">
      <div class="pb-ic">✅</div>
      <div class="pb-txt">录入表已清空，所有文章都已完成分析并写入「人生灵感库」。</div>
    </div>`;
  } else {
    pendingBanner = `<div class="pending-banner ok">
      <div class="pb-ic">ℹ️</div>
      <div class="pb-txt">录入表状态暂不可用（飞书连接异常），稍后刷新重试。</div>
    </div>`;
  }

  let html = pendingBanner + `<div class="grid cols-3" style="margin-bottom:18px">
    ${stat('📅 今日待办', todoPending, '项待完成 / 共 '+todayTodos.length+' 项', 'todos')}
    ${stat('🌱 微习惯', habitDoneToday+'/'+habits.length, '今日已打卡', 'habits')}
    ${stat('🎯 重大事项', major.length, '进行中 '+upcoming.length+' 项', 'major')}
  </div>
  <div class="grid cols-3" style="margin-bottom:18px">
    ${stat('🚀 项目任务', projCount, '跨 4 个项目', 'projects')}
    ${stat('✍️ 内容资产', insp+topics, '灵感 '+insp+' · 选题 '+topics, 'content')}
    ${stat('📚 知识沉淀', knowledge, '7 大主题', 'work')}
  </div>`;

  html += `<div class="grid cols-2">`;
  html += `<div class="card"><div class="h"><div class="t">⚡ 今日聚焦</div><button class="btn ghost mini" onclick="go('todos')">去待办</button></div>`;
  if(!todayTodos.length) html += `<div class="empty">今天还没有待办</div>`;
  else todayTodos.slice(0,6).forEach(t=>{ html += `<div class="todo ${t.done?'done':''}"><div class="check ${t.done?'on':''}" onclick="toggleDashboardTodo('${t.id}')">✓</div><div class="todo-text">${esc(t.title)}</div></div>`; });
  html += `</div>`;

  html += `<div class="card"><div class="h"><div class="t">🎯 重大事项</div><button class="btn ghost mini" onclick="go('major')">查看全部</button></div>`;
  if(!upcoming.length) html += `<div class="empty">暂无进行中的重大事项</div>`;
  else upcoming.forEach(m=>{ html += `<div class="item" style="padding:10px 12px;margin-bottom:8px"><div class="it-title" style="font-size:13.5px">${esc(m.title||'')}</div><div class="meta">${m.date?('<b>日期：</b>'+esc(m.date)+'　'):''}${m.status?('<b>状态：</b>'+esc(m.status)):''}</div></div>`; });
  html += `</div></div>`;

  view.innerHTML = html;
}
async function toggleDashboardTodo(id){ const a=(dashCache&&dashCache.todayTodos)||[]; const t=a.find(x=>x.id===id); if(!t) return; t.done=!t.done; try{ await apiUpdate('todos',id,t); await render(); }catch(e){ alert('更新失败：'+(e.message||e)); } }

/* ---------- main render ---------- */
const view = document.getElementById('view');
async function render(){
  setHeader(current);
  view.innerHTML = '<div class="empty">⏳ 加载中…</div>';
  try{
    if(current==='dashboard') return await renderDashboard();
    const s = SECTIONS[current];
    if(!s) return;
    const kind = s.kind;
    if(kind==='todos') return await renderTodos();
    if(kind==='habits') return await renderHabits();
    if(kind==='review') return await renderReview();
    if(kind==='diary') return await renderDiary();
    if(kind==='project') return await renderProject(current);
    if(kind==='article') return await renderArticle();
    if(kind==='annual') return await renderAnnual();
    if(kind==='grid') return await renderGrid(current);
    if(kind==='wishes') return await renderWishes();
    if(kind==='insprec') return await renderInsp();
    return await renderList(current, kind);
  }catch(e){
    view.innerHTML = `<div class="empty">⚠️ 出错了：${esc(e.message||e)}</div>`;
  }
}

/* ---------- 访问密码门 ---------- */
function showGate(){ const g=document.getElementById('gate'); if(g) g.classList.add('show'); }
function hideGate(){ const g=document.getElementById('gate'); if(g) g.classList.remove('show'); }
async function doLogin(){
  const pwd=document.getElementById('gatePwd').value;
  const err=document.getElementById('gateErr'); err.textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    if(r.ok){ hideGate(); render(); }
    else { err.textContent='密码错误'; }
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function checkAuth(){
  try{
    const r=await fetch(API+'/me');
    if(r.ok){ hideGate(); render(); return; }
  }catch(e){}
  showGate();
}
const _gateBtn=document.getElementById('gateBtn');
if(_gateBtn) _gateBtn.addEventListener('click', doLogin);
const _gatePwd=document.getElementById('gatePwd');
if(_gatePwd) _gatePwd.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

checkAuth();
</script>
