/* ---------- todos（三列：未完成项 / 今日待办 / 明日计划） ---------- */
// 把飞书回传的截止时间（UTC 毫秒或字符串）归一为 datetime-local 值 "YYYY-MM-DDTHH:MM"
function fmtDeadline(v){
  if(!v) return '';
  if(typeof v === 'number'){
    const d = new Date(v + 8*3600*1000), p = n => (n<10?'0'+n:'');
    return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}T${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  }
  return String(v).replace(' ','T').slice(0,16);
}
// 北京时间今天的 YYYY-MM-DD（与截止时间显示口径一致）
function todayStr(){
  const d = new Date(Date.now() + 8*3600*1000), p = n => (n<10?'0'+n:'');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}
const datePart = s => s ? String(s).slice(0,10) : '';
const WK = ['日','一','二','三','四','五','六'];
function niceDate(d){
  const p=String(d).split('-').map(Number); if(p.length<3) return d;
  return `${p[0]}年${p[1]}月${p[2]}日 周${WK[new Date(p[0],p[1]-1,p[2]).getDay()]}`;
}
function todoBucket(t, td){ return datePart(t.deadline) || td; }   // 截止日期（无则按今日）
async function renderTodos(){
  let arr;
  try{ arr = await apiList('todos'); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }
  cache.todos = arr;
  arr.forEach(t => { if (t.deadline) t.deadline = fmtDeadline(t.deadline); });
  const td = todayStr();
  const overdue = arr.filter(t => !t.done && todoBucket(t, td) < td);  // 左：未完成项（逾期）
  const mid     = arr.filter(t => todoBucket(t, td) >= td);            // 中：今日待办（含今日+未来，已完成同列划线）
  const future  = arr.filter(t => !t.done && todoBucket(t, td) > td);  // 右：明日计划（未来未完成，是 mid 的子集，自动同步）
  let html = `<div class="todos-3col">`;
  // —— 板块一：左侧未完成项 ——
  html += `<div class="tcol side">
    <div class="tcol-h"><div class="th-t">未完成项</div><div class="th-n warn">${overdue.length}</div></div>
    <div class="ts-list">`;
  if(!overdue.length) html += `<div class="empty sm">🎉 没有逾期事项</div>`;
  overdue.forEach(t => html += tsRow(t, false));
  html += `</div></div>`;
  // —— 板块二：中间今日待办（主展示位）——
  html += `<div class="tcol mid">
    <div class="tm-date"><b>${niceDate(td)}</b></div>
    <div class="tm-title">待办事项</div>
    <div class="todo-add">
      <input id="todoInput" class="ti" placeholder="输入待办内容，回车添加…" onkeydown="if(event.key==='Enter')addTodo()"/>
      <button class="btn primary" onclick="addTodo()">＋</button>
    </div>
    <div class="tm-list">`;
  if(!mid.length) html += `<div class="empty sm">今天还没有待办，上面加一条吧 ✅</div>`;
  mid.forEach(t => html += tmRow(t));
  html += `</div></div>`;
  // —— 板块三：右侧明日计划（只读）——
  html += `<div class="tcol side">
    <div class="tcol-h"><div class="th-t">明日计划</div><div class="th-n">${future.length}</div></div>
    <div class="ts-list">`;
  if(!future.length) html += `<div class="empty sm">没有未来的计划 🌙</div>`;
  future.forEach(t => html += tsRow(t, true));
  html += `</div></div>`;
  html += `</div>`;
  view.innerHTML = html;
}
// 侧栏行：内容 + 截止时间 + 备注(下) + 删除（ro 时无删除）
function tsRow(t, ro){
  const dp = datePart(t.deadline) || todayStr();
  const note = t.note ? `<div class="ts-note-line">📝 ${esc(t.note)}</div>` : '';
  const del = ro ? '' : `<button class="ts-move" title="移到今日" onclick="moveTodoToToday('${t.id}')">➡</button><button class="ts-del" title="删除" onclick="delTodo('${t.id}')">🗑</button>`;

async function toggleWish(id){
  const t=(wishArr||[]).find(x=>x.id===id); if(!t) return;
  t.done=!t.done;
  const item=document.getElementById('wish-'+id);
  if(t.done){
    // 打勾实现：记录当前北京时间（由服务端换算成飞书时间戳），就地更新 DOM 不打断操作
    const now=new Date(), p=n=>('0'+n).slice(-2);
    const local=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`;
    t.realized=local;
    if(item){
      item.classList.add('done');
      if(!item.querySelector('.wish-date')){
        const span=document.createElement('span');
        span.className='wish-date';
        span.textContent='实现于 '+local.replace('T',' ');
        item.insertBefore(span, item.querySelector('.wish-del'));
      }
    }
  }else{
    t.realized='';   // 取消实现：清空实现时间
    if(item){
      item.classList.remove('done');
      const ds=item.querySelector('.wish-date'); if(ds) ds.remove();
    }
  }
  try{ await apiUpdate('wishes', id, t); }
  catch(e){ alert('更新失败：'+(e.message||e)); }

}

/* ---------- habits ---------- */
let habitMonthOffset = 0;
function bjDateStr(d){ const p=n=>n<10?'0'+n:''+n; const bj=new Date(d.getTime()+8*3600*1000); return bj.getUTCFullYear()+'-'+p(bj.getUTCMonth()+1)+'-'+p(bj.getUTCDate()); }
function bjToday(){ return bjDateStr(new Date()); }
function habitMonthInfo(offset){
  const now=new Date();
  const base=new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const days=[];
  for(let i=1;i<=dim;i++) days.push(new Date(y,m,i));
  return {y,m,dim,days,label:y+'年'+(m+1)+'月'};
}
function habitMonthStats(hist, y, m){
  const total=new Date(y,m+1,0).getDate();
  let done=0;
  if(hist) for(const k in hist){ const p=k.split('-'); if(+p[0]===y && +p[1]===m+1) done++; }
  return done+'/'+total;
}
function habitShiftMonth(d){ habitMonthOffset+=d; renderHabits(); }
async function renderHabits(){
  let arr;
  try{ arr = await apiHabits(); }
  catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; return; }
  cache.habits = arr;
  const info = habitMonthInfo(habitMonthOffset);
  const todayStr = bjToday();
  const nextDisabled = habitMonthOffset>=0 ? 'disabled' : '';
  let html = `<div class="card"><div class="h"><div class="t">微习惯打卡</div>
    <div class="inline-add" style="margin:0;width:auto"><input id="habitInput" placeholder="新增习惯名称…" style="padding:7px 11px"/>
    <button class="btn" onclick="addHabit()">+ 习惯</button></div></div>`;
  html += `<div class="mo-nav"><button class="btn mini" onclick="habitShiftMonth(-1)">‹ 上一月</button>
    <span class="mo-label">${info.label}</span>
    <button class="btn mini" ${nextDisabled} onclick="habitShiftMonth(1)">下一月 ›</button></div>`;
  if(!arr.length){ html += `<div class="empty">还没有习惯，添加一个开始坚持吧 🌱</div></div>`; view.innerHTML=html; return; }
  const wd=['日','一','二','三','四','五','六'];
  const headNums = info.days.map(d=>{
    const w=d.getDay();
    const isWe=(w===0||w===6);
    return `<i class="${isWe?'we':''}"><span class="dn">${d.getDate()}</span><span class="dw">${wd[w]}</span></i>`;
  }).join('');
  html += `<div class="habit-head"><div class="nh">名称</div><div class="daynums">${headNums}</div><div class="ph">进度</div><div class="dh"></div></div>`;
  arr.forEach(h=>{
    const prog = habitMonthStats(h.history, info.y, info.m);
    let cells='';
    info.days.forEach(d=>{
      const dy=bjDateStr(d);
      const on = h.history && h.history[dy];
      const isToday = dy===todayStr;
      const w = d.getDay();
      const isWe = (w===0||w===6);
      const clickable = dy <= todayStr;
      const cls = 'cell ' + (on?'on ':'') + (isWe?'we ':'') + (isToday?'today ':'') + (clickable?'':'disabled');
      const onclick = clickable ? `onclick="toggleHabit('${h.id}','${dy}')"` : '';
      cells += `<div class="${cls.trim()}" ${onclick}>${on?'✓':''}</div>`;
    });
    html += `<div class="habit-row">
      <span class="habit-nm">${esc(h.name)}</span>
      <div class="habit-days">${cells}</div>
      <span class="habit-prog">${prog}</span>
      <button class="habit-del" title="删除" onclick="delHabit('${h.id}')">🗑</button>
    </div>`;
  });
  html += '</div>';
  view.innerHTML = html;
}

/* ---------- 年度计划 2.0（模块式：开头 + 标题/内容分组 + 结尾） ---------- */
let a2Year = new Date().getFullYear();
let a2Model = { opening:null, ending:null, groups:[], arrange:2, arrangeRecId:null };
let a2Gen = 0;
let a2LoadedYear = null;
const A2_TITLE_PALETTE = ['#fee2e2','#fef3c7','#dcfce7','#dbeafe','#f3e8ff','#ffe4e6','#cffafe','#fce7f3','#ecfccb','#ffedd5','#e0e7ff','#ccfbf1'];
function a2RandColor(){ return A2_TITLE_PALETTE[Math.floor(Math.random()*A2_TITLE_PALETTE.length)]; }
// 把任意格子颜色向白色混合，得到浅色背景；已很浅则原样返回（保证取色面板所见即所得）
function a2HexToRgb(h){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); if(h.length!==6) return null; return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; }
function a2Lighten(hex){
  const c = a2HexToRgb(hex); if(!c) return hex;
  const lum = (0.299*c.r + 0.587*c.g + 0.114*c.b)/255; // 0..1 相对亮度
  if(lum >= 0.82) return hex;                          // 已经很浅，原样（面板浅色不二次处理）
  const t = (0.82 - lum) / (1 - lum);                  // 需向白混合的比例
  const m = x => Math.round(x + (255 - x) * t);
  const h2 = v => v.toString(16).padStart(2,'0');
  return '#' + h2(m(c.r)) + h2(m(c.g)) + h2(m(c.b));
}
function a2BuildModel(recs, year){
  recs = (recs||[]).map(r=>({ id:r.id, year:Number(r.year)||year, type:r.type||'', cellColor:r.cellColor||'#ffffff', textColor:r.textColor||'#0f172a', text:r.text||'', sort:Number(r.sort)||0, done:!!r.done }));
  recs.sort((a,b)=>a.sort-b.sort);
  let opening=null, ending=null, arrange=2, arrangeRecId=null; const groups=[];
  for(const r of recs){
    if(r.type==='开头'){ opening=r; }
    else if(r.type==='结尾'){ ending=r; }
    else if(r.type==='分组'){ const v=Math.round(Number(r.sort)/1000); arrange=(v>=2&&v<=4)?v:2; arrangeRecId=r.id; }
    else if(r.type==='标题'){ let g=Math.floor((r.sort-20000)/100); if(g<0)g=0; groups[g]={g,title:r,contents:[]}; }
    else if(r.type==='内容'){ let g=Math.floor((r.sort-20000)/100); if(g<0)g=0; if(!groups[g]) groups[g]={g,title:null,contents:[]}; groups[g].contents.push(r); }
  }
  return { opening, ending, groups: groups.filter(Boolean), arrange, arrangeRecId };
}
async function a2Load(year){
  const gen = ++a2Gen; a2Year = year;
  view.innerHTML = '<div class="empty">⏳ 加载中…</div>';
  try{
    const all = await localList('annual2');
    if(gen!==a2Gen) return;
    let recs = all.filter(r=> Number(r.year)===Number(year));
    if(!recs.length){
      // 首次进入：自动播种 开头 / 一个默认分组(标题 + 一条内容「无」) / 结尾 / 分组(每行2组)
      await localCreate('annual2', {year, type:'开头', cellColor:'#ffffff', textColor:'#0f172a', sort:10000, text:''});
      await localCreate('annual2', {year, type:'标题', cellColor:a2RandColor(), textColor:'#0f172a', sort:20000, text:''});
      await localCreate('annual2', {year, type:'内容', cellColor:'#ffffff', textColor:'#0f172a', sort:20001, text:'无'});
      await localCreate('annual2', {year, type:'结尾', cellColor:'#ffffff', textColor:'#0f172a', sort:30000, text:''});
      await localCreate('annual2', {year, type:'分组', sort:2000});
      const all2 = await localList('annual2');
      recs = all2.filter(r=> Number(r.year)===Number(year));
    }
    if(gen!==a2Gen) return;
    a2Model = a2BuildModel(recs, year);
    a2LoadedYear = year;
    // 每个年度计划都保证有一条「分组」记录（用于保存每行分组数）
    if(!a2Model.arrangeRecId){
      try{
        const r = await localCreate('annual2', {year, type:'分组', sort:1000*a2Model.arrange});
        a2Model.arrangeRecId = r.id;
      }catch(e){ console.warn('创建分组记录失败', e); }
    }
    a2Paint();
  }catch(e){ view.innerHTML = `<div class="empty">⚠️ 加载失败：${esc(e.message||e)}</div>`; }
}

const A2_PALETTE = [
  { name:'白', v:'#ffffff' }, { name:'灰', v:'#eef1f5' }, { name:'红', v:'#fecaca' },
  { name:'橙', v:'#ffedd5' }, { name:'黄', v:'#fef9c3' }, { name:'绿', v:'#dcfce7' },

function a2OpenPalette(anchor, label, cur, onPick){

function a2DelGroup(g){

  a2Confirm('确定删除该「标题+内容」分组吗？该标题下的所有内容数据将一并删除，此操作不可撤销。', async ()=>{
    try{
      const jobs=[];
      if(grp.title) jobs.push(localDelete('annual2', grp.title.id));
      grp.contents.forEach(c=> jobs.push(localDelete('annual2', c.id)));
      await Promise.all(jobs);
      a2Model.groups = a2Model.groups.filter(x=>x.g!==g);

async function a2SyncSorts(){
  const jobs=[];
  a2Model.groups.forEach((grp,i)=>{
    grp.g=i;
    if(grp.title){ const ns=20000+i*100; if(grp.title.sort!==ns){ grp.title.sort=ns; jobs.push(a2Patch(grp.title.id,{sort:ns})); } }
    grp.contents.forEach((c,j)=>{ const ns=20000+i*100+(j+1); if(c.sort!==ns){ c.sort=ns; jobs.push(a2Patch(c.id,{sort:ns})); } });
  });
  await Promise.all(jobs);
}

function mp2Today(){
  const d = new Date(Date.now() + 8 * 3600 * 1000), p = n => n < 10 ? '0' + n : '' + n;
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
}

  mp2Year = n.getFullYear(); mp2Month = n.getMonth() + 1;
  mp2Load();

function mp2BuildGroups(rows){
  const sorted = rows.slice().sort((a, b) =>
    (a.seq - b.seq) ||
    String(a.deadline || '').localeCompare(String(b.deadline || '')) ||
    String(a.id).localeCompare(String(b.id)));
  const groups = [], map = new Map();
  for (const r of sorted) {
    if (!map.has(r.seq)) { const g = { seq: r.seq, rows: [] }; map.set(r.seq, g); groups.push(g); }
    map.get(r.seq).rows.push(r);
  }
  return groups;
}
function mp2CellClass(r){
  if (r.done) return 'mp2-green';
  const t = mp2Today();
  if (!r.deadline) return '';
  if (r.deadline === t) return 'mp2-orange';
  if (r.deadline < t) return 'mp2-red';
  return '';
}

  return `<input type="date" class="mp2-date" value="${esc(r.deadline || '')}" onchange="mp2EditDeadline('${r.id}', this.value)">`;
}

  return `<span class="mp2-check mp2-daily ${r.daily ? 'on' : ''}" title="每日任务（勾选后无需截止时间）" onclick="mp2ToggleDaily('${r.id}', ${r.daily ? 0 : 1})">${r.daily ? '✓' : ''}</span>`;

}
function mp2Paint(){
  const groups = mp2BuildGroups(mp2Data);
  let html = '<div class="mp2">';
  html += `<div class="mp2-topbar">
    <button class="mp2-nav" onclick="mp2SwitchMonth(-1)" title="上个月">‹</button>
    <div class="mp2-title">${mp2Year}年${mp2Month}月计划清单</div>
    <button class="mp2-nav" onclick="mp2SwitchMonth(1)" title="下个月">›</button>
  </div>`;
  html += '<table class="mp2-table"><thead><tr><th>序号</th><th>计划事项</th><th>计划内容</th><th>每日</th><th>截止时间</th><th>完成</th><th></th></tr></thead><tbody>';
  if (!groups.length) {
    html += '<tr><td colspan="7" class="mp2-empty">暂无计划，点击底部「＋ 添加计划」</td></tr>';
  }
  for (const g of groups) {
    const seqRowspan = g.rows.length;
    let i = 0;
    while (i < g.rows.length) {
      const first = g.rows[i];
      let j = i;
      while (j < g.rows.length && (g.rows[j].item || '') === (first.item || '')) j++;
      const itemRowspan = j - i;
      for (let k = i; k < j; k++) {
        const r = g.rows[k];
        const isFirstOfRun = (k === i);
        const isFirstSeq = (i === 0 && k === 0);
        const cc = mp2CellClass(r);
        html += '<tr data-id="' + r.id + '">';
        if (isFirstSeq) html += `<td class="col-seq" rowspan="${seqRowspan}">${r.seq}</td>`;
        if (isFirstOfRun) html += `<td class="col-item" rowspan="${itemRowspan}"><div class="mp2-item" contenteditable="true" onblur="mp2EditItem('${r.id}', this.innerText)">${esc(r.item)}</div></td>`;
        html += `<td class="col-content ${cc}"><div class="mp2-content" contenteditable="true" onblur="mp2EditContent('${r.id}', this.innerText)">${esc(r.content)}</div></td>`;
        html += `<td class="col-daily">${mp2DailyHTML(r)}</td>`;
        html += `<td class="col-deadline ${cc}">${mp2DeadlineHTML(r)}</td>`;
        html += `<td class="col-done">${mp2DoneHTML(r)}</td>`;
        html += `<td class="col-del"><button class="mp2-del" title="删除此条" onclick="mp2Del('${r.id}')">🗑</button></td>`;
        html += '</tr>';
      }
      i = j;
    }
  }
  html += '</tbody></table>';
  html += '<div class="mp2-add" onclick="mp2Add()">＋ 添加计划</div>';
  html += '</div>';
  view.innerHTML = html;
}
async function mp2EditItem(id, text){
  text = (text || '').trim();
  const old = mp2Data.find(x => x.id === id); if (!old) return;
  const oldText = old.item;
  if (text === oldText) return;
  if (!text) { alert('计划事项不能为空'); return; }
  // 级联：修改计划事项时，本月内其它相同文字的计划事项一并更新
  const affected = mp2Data.filter(x => x.item === oldText);
  try {
    await Promise.all(affected.map(x => localUpdate('monthplan2', x.id, { item: text })));
    await mp2Load();
  } catch (e) { alert('保存失败：' + (e.message || e)); }
}
async function mp2EditContent(id, text){
  const r = mp2Data.find(x => x.id === id); if (!r) return;
  const t = (text || '');
  if (t === r.content) return;
  try { await localUpdate('monthplan2', id, { content: t }); r.content = t; }
  catch (e) { alert('保存失败：' + (e.message || e)); }
}
async function mp2EditDeadline(id, val){

async function mp2ToggleDone(id, next){

function mp2Add(){

  const maxSeq = existingSeqs.length ? existingSeqs[existingSeqs.length - 1] : 0;

function lYearDays(y){let sum=348;for(let i=0x8000;i>0x8;i>>=1)sum+=(lunarInfo[y-1900]&i)?1:0;return sum+leapDays(y);}
function leapDays(y){if(leapMonth(y)){return ((lunarInfo[y-1900]&0x10000)?30:29);}return 0;}
function leapMonth(y){return (lunarInfo[y-1900]&0xf);}
function monthDays(y,m){return ((lunarInfo[y-1900]&(0x10000>>m))?30:29);}
function solarToLunar(yy,mm,dd){
  const baseDate=new Date(1900,0,31);
  const objDate=new Date(yy,mm-1,dd);
  let offset=Math.round((objDate-baseDate)/86400000);
  let i=1900,temp=0;
  for(i=1900;i<2101&&offset>0;i++){ temp=lYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  const lunarY=i;
  const leap=leapMonth(i);
  let isLeap=false,m=1;
  for(m=1;m<13&&offset>0;m++){
    if(leap>0&&m===(leap+1)&&!isLeap){ m--; isLeap=true; temp=leapDays(i); }
    else { temp=monthDays(i,m); }
    if(isLeap&&m===(leap+1)) isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&m===leap+1){ if(isLeap){ isLeap=false; } else { isLeap=true; m--; } }
  if(offset<0){ offset+=temp; m--; }
  return {lunarYear:lunarY,lunarMonth:m,lunarDay:offset+1,isLeap:isLeap};
}
const lunarMonthNames=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const lunarDay1='初十廿三', lunarDay2='一二三四五六七八九十';
function cnLunarDay(d){
  if(d===10)return '初十';
  if(d===20)return '二十';
  if(d===30)return '三十';
  if(d<10)return '初'+lunarDay2[d-1];
  if(d<20)return '十'+lunarDay2[d-11];
  if(d<30)return '廿'+lunarDay2[d-21];
  return '';
}
function lunarText(yy,mm,dd){
  const L=solarToLunar(yy,mm,dd);
  const m=(L.isLeap?'闰':'')+lunarMonthNames[L.lunarMonth-1]+'月';
  return m+cnLunarDay(L.lunarDay);
}
// 格子内农历：初一只显示月份（不写“初一”）；其余日期只显示日，不写月份
function lunarCellText(yy,mm,dd){
  const L=solarToLunar(yy,mm,dd);
  const mName=(L.isLeap?'闰':'')+lunarMonthNames[L.lunarMonth-1];
  if(L.lunarDay===1) return mName;
  return cnLunarDay(L.lunarDay);
}

/* ---------- 提醒配色（按当前真实时间相对提醒时间） ---------- */
// 提醒时间前1小时~前10分钟：橙黄；前后10分钟：红；后10分钟之后：紫；更早：默认
function remColorClass(atMs){
  const diff=atMs-Date.now();
  if(diff < -600000) return 'purple';
  if(diff <= 600000) return 'red';
  if(diff < 3600000) return 'orange';
  return 'def';
}
function scheduleAtMs(s){
  if(!s.remind||!s.date||!s.time) return 0;
  const p=s.date.split('-'), t=s.time.split(':');
  return new Date(+p[0], +p[1]-1, +p[2], +(t[0]||0), +(t[1]||0), 0, 0).getTime();
}

function renderTaskMindmap(id, tasks, s){
  const tidSet = new Set(tasks.map(t => String(t.tid)).filter(Boolean));
  const tStr = today();
  const visited = new Set();

  // 待办 ⇄ 完成 切换按钮
  const statusHTML = t => {
    const done = (t.status || '待办') === '已完成';
    return `<button class="mm-status ${done ? 'done' : ''}" title="点击切换 待办 / 完成" onclick="mmToggleStatus('${id}','${t.id}')">${done ? '完成' : '待办'}</button>`;
  };
  // 「每日」勾选格子：打勾＝每日任务（显示「每日」二字，隐藏截止时间）；未打勾＝可设置截止时间
  const dailyHTML = t => {
    const isDaily = (t.daily || '否') === '是';          // 打勾 → 每日任务
    const chk = isDaily ? 'checked' : '';                 // 打勾 → 显示「每日」二字
    const box = `<label class="mm-daily-chk" title="勾选＝每日任务（隐藏截止时间）；取消＝可设置截止时间"><input type="checkbox" ${chk} onchange="mmToggleDaily('${id}','${t.id}', this.checked)"></label>`;
    if (isDaily) {
      return `${box}<span class="mm-daily-word">每日</span>`;
    }
    const dl = (t.deadline || '').trim();
    let dc = '';
    if ((t.status || '') === '已完成') dc = 'done';
    else if (dl && dl === tStr) dc = 'today';
    else if (dl && dl < tStr) dc = 'overdue';
    return `${box}<span class="mm-dl"><input type="date" class="mm-date ${dc}" value="${esc(dl)}" onchange="mmSetDeadline('${id}','${t.id}', this.value)"><span class="mm-cal" title="设置日期" onclick="mmPickDate('${id}','${t.id}')">📅</span></span>`;
  };
  // 行内操作图标：＋子任务 / 编辑⇄保存 / 备注 / 删除（紧挨任务文字右边）
  const opsHTML = t => {
    const editing = (t.id === mmEditTitleId);
    const editBtn = editing
      ? `<button class="mm-ic" title="保存标题" onclick="mmSaveTitle('${id}','${t.id}')">💾</button>`
      : `<button class="mm-ic" title="编辑标题" onclick="mmEditTitle('${id}','${t.id}')">✎</button>`;
    return `<span class="mm-ops">
      <button class="mm-ic" title="添加子任务" onclick="mmAddTask('${id}','${String(t.tid || '')}')">＋</button>
      ${editBtn}
      <button class="mm-ic" title="备注" onclick="mmAddNote('${id}','${t.id}')">📝</button>
      <button class="mm-ic" title="删除" onclick="delGeneric('${id}','${t.id}')">🗑</button>
    </span>`;
  };
  // 备注行（有备注或正在编辑备注时显示）
  const noteHTML = t => {
    if (!t.note && t.id !== mmEditNoteId) return '';
    const attr = (t.id === mmEditNoteId) ? ' contenteditable="true" onblur="mmSaveNote(\'' + id + '\',\'' + t.id + '\')"' : '';
    return `<div class="mm-note"${attr}>${esc(t.note || '')}</div>`;
  };
  const renderNode = (t) => {
    if (visited.has(t.id)) return '';
    visited.add(t.id);
    const childTasks = [];
    tasks.forEach(c => {
      if (!visited.has(c.id)) {
        const cp = (c.parent || '').trim();
        // 仅按「上级任务标题」字段(存父任务 ID)判定父子关系，避免标题巧合造成错挂
        if (cp === String(t.tid)) childTasks.push(c);
      }
    });
    const hasKids = childTasks.length > 0;
    const coll = mmCollapsed.has(t.id) ? 'collapsed' : '';
    const titleEditable = (t.id === mmEditTitleId);
    const titleCls = 'mm-title' + (titleEditable ? ' editing' : '');
    const titleAttr = titleEditable ? ' contenteditable="true"' : '';
    const titleText = titleEditable ? esc(t.taskTitle || '') : esc(t.taskTitle || '(未命名)');
    const kidsHtml = hasKids ? `<div class="mm-children">${childTasks.map(renderNode).join('')}</div>` : '';
    return `<div class="mm-node ${coll}" data-id="${t.id}">
      <div class="mm-row">
        <span class="mm-toggle" onclick="toggleMM('${t.id}')">${hasKids ? '▾' : '·'}</span>
        <span class="${titleCls}"${titleAttr}>${titleText}</span>
        ${statusHTML(t)}
        ${dailyHTML(t)}
        ${opsHTML(t)}
      </div>
      ${noteHTML(t)}
      ${kidsHtml}
    </div>`;
  };
  // 顶层任务：parent 为空，或 parent 不等于本项目任何任务 ID（按「上级任务标题」字段判定）
  const isTop = t => { const p = (t.parent || '').trim(); return !p || !tidSet.has(p); };
  const top = tasks.filter(isTop);
  const rootChildren = top.map(renderNode).join('');
  const orphans = tasks.filter(t => !visited.has(t.id)).map(renderNode).join('');
  const emptyHint = (rootChildren || orphans) ? '' : '<div class="empty" style="margin:8px 0 4px">还没有任务，点击上方「＋」添加第一个吧</div>';
  return `<div class="mindmap">
    <div class="mm-node mm-root">
      <div class="mm-row mm-root-row">
        <span class="mm-toggle root" title="项目根">▣</span>
        <span class="mm-title root-title">${esc(s.name)}</span>
        <button class="mm-ic" title="添加任务" onclick="mmAddTask('${id}', '')">＋</button>
      </div>
      <div class="mm-children">${rootChildren}${orphans}</div>
      ${emptyHint}
    </div>
  </div>`;
}

            <input type="checkbox" ${r.used ? 'checked' : ''} onchange="topicsField(${r._uid},'used',this.checked)">已使用</label>
          <button class="btn mini" onclick="topicsSaveRow(${r._uid})">保存</button>
          <button class="btn danger mini" onclick="topicsDelRow(${r._uid})">删除</button>
        </div></div>`;
    });
  }
  html += `<div style="padding:10px"><button class="btn" onclick="topicsAddRow()">+ 添加</button></div></div>`;
  view.innerHTML = html;
}
async function topicsSaveRow(uid) {
  if (!topicsState) return;
  const row = topicsState.rows.find(r => r._uid === uid);
  if (!row) return;
  const obj = { title: row.title || '', platform: row.platform || '', status: row.status || '灵感', note: row.note || '', used: !!row.used };
  try {
    if (row.id) {
      await apiUpdate('topics', row.id, obj);
    } else {
      const c = await apiCreate('topics', obj);
      row.id = c.id; row._new = false;
    }
    cache.topics = topicsState.rows.filter(r => r.id).map(r => ({ id: r.id }));
    topicsMsg = row._new === false ? '✅ 已保存到飞书' : '✅ 已新增并保存到飞书';
    paintTopics();
    setTimeout(() => { if (topicsMsg) { topicsMsg = ''; paintTopics(); } }, 1600);
  } catch (e) {
    alert('保存失败：' + (e.message || e));
  }
}
async function topicsDelRow(uid) {
  if (!topicsState) return;
  const row = topicsState.rows.find(r => r._uid === uid);
  if (!row) return;
  if (row.id) {
    if (!confirm('确认删除这条选题？')) return;
    try { await apiDelete('topics', row.id); }
    catch (e) { alert('删除失败：' + (e.message || e)); return; }
  }
  topicsState.rows = topicsState.rows.filter(r => r._uid !== uid);
  cache.topics = topicsState.rows.filter(r => r.id).map(r => ({ id: r.id }));
  paintTopics();
}
function topicsAddRow() {
  if (!topicsState) topicsState = { rows: [], loaded: true };
  topicsState.rows.push({ _uid: ++topicsUid, id: null, title: '', platform: '', status: '灵感', note: '', used: false, _new: true });
  paintTopics();
  // 聚焦到新行的第一个输入框
  const inputs = view.querySelectorAll('.item input');
  if (inputs.length) inputs[inputs.length - 4] && inputs[inputs.length - 4].focus();
}

async function render(){
  setHeader(current);
  view.innerHTML = '<div class="empty">⏳ 加载中…</div>';
  try{
    if(current==='dashboard') return await renderDashboard();
    const s = SECTIONS[current];
    if(!s) return;
    const kind = s.kind;
    if(kind==='todos') return await renderTodos();
    if(kind==='habits') return await renderHabits();
    if(kind==='review') return await renderReview();
    if(kind==='diary') return await renderDiary();
    if(kind==='project') return await renderProject(current);
    if(kind==='article') return await renderArticle();
    if(kind==='annual2') return await renderAnnual2();
    if(kind==='monthplan2') return await renderMonthPlan2();
    if(kind==='wishes') return await renderWishes();
    if(kind==='insprec') return await renderInsp();
    if(kind==='topics') return await renderTopics();
    if(current==='major') return await renderMajor();
    if(current==='calendar') return await renderCalendar();
    return await renderList(current, kind);
  }catch(e){
    view.innerHTML = `<div class="empty">⚠️ 出错了：${esc(e.message||e)}</div>`;
  }
}

/* ---------- 访问密码门 ---------- */
function showGate(){ const g=document.getElementById('gate'); if(g) g.classList.add('show'); }
function hideGate(){ const g=document.getElementById('gate'); if(g) g.classList.remove('show'); }
async function doLogin(){
  const pwd=document.getElementById('gatePwd').value;
  const err=document.getElementById('gateErr'); err.textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    if(r.ok){ hideGate(); render(); seedAll(); }
    else { err.textContent='密码错误'; }
  }catch(e){ err.textContent='网络错误，请重试'; }
}
async function checkAuth(){
  try{
    const r=await fetch(API+'/me');
    if(r.ok){ hideGate(); render(); seedAll(); return; }
  }catch(e){}
  showGate();
}
const _gateBtn=document.getElementById('gateBtn');
if(_gateBtn) _gateBtn.addEventListener('click', doLogin);
const _gatePwd=document.getElementById('gatePwd');
if(_gatePwd) _gatePwd.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

checkAuth();
</script>
