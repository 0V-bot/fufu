<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>傅傅的工作台</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#1f2733; --muted:#7a869a;
    --line:#e8ebf2; --line2:#eef1f7; --brand:#4f46e5; --brand-soft:#eef0ff;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
    --radius:14px;
  }
  /* 访问密码门 */
  #gate{position:fixed;inset:0;background:linear-gradient(135deg,#eef0ff,#f5f6fa);display:none;align-items:center;justify-content:center;z-index:9999;}
  #gate.show{display:flex;}
  .gate-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:34px 30px;width:320px;max-width:90vw;text-align:center;}
  .gate-logo{font-size:40px;}
  .gate-card h2{margin:10px 0 4px;font-size:20px;color:var(--ink);}
  .gate-sub{margin:0 0 18px;color:var(--muted);font-size:13px;}
  #gatePwd{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;}
  #gatePwd:focus{border-color:var(--brand);}
  #gateBtn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  #gateBtn:hover{opacity:.92;}
  .gate-err{margin-top:12px;color:#e11d48;font-size:13px;min-height:16px;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:200px; flex:0 0 200px; background:#0f172a; color:#cbd5e1;
    padding:18px 10px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px;}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6); font-size:20px;
  }
  .brand .name{font-size:16px;font-weight:700;color:#fff;line-height:1.2;}
  .brand .sub{font-size:11px;color:#64748b;}
  .nav{margin-top:6px;}
  .nav-group{margin-bottom:4px;}
  .nav-head{
    display:flex;align-items:center;gap:9px; padding:9px 10px; border-radius:10px;
    cursor:pointer; user-select:none; font-size:14px; color:#cbd5e1; transition:.15s;
  }
  .nav-head:hover{background:#1e293b;}
  .nav-head .ic{font-size:16px;width:20px;text-align:center;}
  .nav-head .arrow{margin-left:auto; transition:.2s; font-size:11px; color:#64748b;}
  .nav-group.collapsed .arrow{transform:rotate(-90deg);}
  .nav-group.collapsed .nav-items{display:none;}
  .nav-items{padding:2px 0 4px 14px; margin-left:10px; border-left:1px solid #1e293b;}
  .nav-item{
    display:flex;align-items:center;gap:9px; padding:7px 10px; border-radius:9px;
    font-size:13px; color:#94a3b8; cursor:pointer; transition:.15s;
  }
  .nav-item:hover{background:#1e293b; color:#e2e8f0;}
  .nav-item.active{background:var(--brand); color:#fff; font-weight:600;}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7;}
  .nav-item.red{color:#ef4444;}
  .nav-item.red .dot{background:#ef4444;opacity:1;}
  .nav-item.red:hover{color:#fca5a5;}

  /* Main */
  .main{flex:1; min-width:0; padding:26px 30px 60px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .crumb b{color:var(--ink);}
  .page-title{font-size:23px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;}
  .page-title .tag{font-size:12px;font-weight:600;color:#fff;background:var(--brand);padding:3px 10px;border-radius:999px;}
  .page-hint{font-size:13px;color:var(--muted);margin-top:4px;}
  .date-pill{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .sync-btn{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fff;background:var(--brand);border:none;padding:8px 16px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow);transition:background .15s,transform .1s;}
  .sync-btn:hover{filter:brightness(1.06);}
  .sync-btn:active{transform:scale(.97);}
  .sync-btn.syncing{background:#f59e0b;pointer-events:none;}
  .sync-btn.syncing .sync-ic{animation:spin 1s linear infinite;}
  .sync-btn.done{background:#16a34a;}
  .sync-btn.err{background:#dc2626;}
  .sync-badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;color:#fff;background:#ef4444;border-radius:999px;padding:0 5px;box-shadow:0 0 0 2px var(--panel);}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  /* Cards / grid */
  .grid{display:grid;gap:16px;}
  .cols-2{grid-template-columns:repeat(2,1fr);}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card .h .t{font-weight:700;font-size:15px;}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px;border:1.5px dashed var(--line);border-radius:12px;}

  /* Buttons */
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 15px;border-radius:10px;background:var(--brand);color:#fff;transition:.15s;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--brand-soft);color:var(--brand);}
  .btn.soft{background:#f1f3f9;color:var(--ink);}
  .btn.mini{padding:5px 10px;font-size:12px;border-radius:8px;}
  .btn.danger{background:#fee2e2;color:#dc2626;}

  /* Item cards */
  .item{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;transition:.15s;}
  .item:hover{border-color:#d7ddf0;box-shadow:0 4px 14px rgba(20,30,60,.05);}
  .item .it-title{font-weight:650;font-size:14.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .item .meta{font-size:12.5px;color:var(--muted);line-height:1.7;}
  .item .meta b{color:#475069;font-weight:600;}
  .item .ops{position:absolute;top:11px;right:11px;display:flex;gap:6px;opacity:0;transition:.15s;}
  .item:hover .ops{opacity:1;}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin:3px 4px 0 0;}
  .item .chips{margin-top:2px;}
  .chip.cat{background:#fff1e6;color:#d97706;}
  .chip.tag{background:#e0f2fe;color:#0ea5e9;}
  .chip.emo{background:#fdeaf3;color:#db2777;}

  /* 重大事项：上方一行并排四个计划格子 */
  .major-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:900px){ .major-row{grid-template-columns:repeat(2,1fr);} }
  .major-cell{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;position:relative;min-height:120px;transition:.15s;}
  .major-cell:hover{border-color:#d7ddf0;box-shadow:0 4px 14px rgba(20,30,60,.05);}
  .major-cell .mc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .major-cell .mc-title{font-weight:700;font-size:15px;line-height:1.4;word-break:break-word;}
  .major-cell .mc-badge{font-size:11px;padding:2px 9px;border-radius:999px;flex:none;white-space:nowrap;}
  .badge-计划中{background:#eef2ff;color:#4f46e5;} .badge-进行中{background:#dcfce7;color:#16a34a;}
  .badge-已完成{background:#f1f5f9;color:#64748b;} .badge-已搁置{background:#fef3c7;color:#d97706;}
  .major-cell .mc-meta{font-size:12.5px;color:var(--muted);line-height:1.7;}
  .major-cell .mc-meta b{color:#475069;font-weight:600;}
  .major-cell .mc-ops{position:absolute;bottom:11px;right:11px;display:flex;gap:6px;opacity:0;transition:.15s;}
  .major-cell:hover .mc-ops{opacity:1;}
  .major-cell .mc-expand{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .major-cell .mc-expand:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
  .major-cell.add-cell{display:flex;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;color:var(--muted);font-size:14px;}
  .major-cell.add-cell:hover{color:var(--brand);border-color:var(--brand);}
  .major-expand-wrap{margin-top:4px;}
  .major-expand-hint{padding:14px 16px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px;background:#fbfcfe;}

  /* 日历：左侧小月历（可切换月份） + 右侧当月展开格子 */
  .cal-nav{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;}
  .cal-cur{font-weight:700;font-size:14px;min-width:92px;text-align:center;}
  .cal-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .cal-left{width:210px;flex:none;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:10px;}
  .cal-left-h{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:10px;}
  .cal-mnav{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.12s;}
  .cal-mnav:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
  .cal-mname{min-width:96px;text-align:center;}
  .cal-mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-mhead{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;}
  .cal-mcell{font-size:12.5px;text-align:center;padding:6px 0;border-radius:7px;color:#475569;transition:.12s;}
  .cal-mempty{}
  .cal-mtoday{background:#e0f2fe;color:#0369a1;font-weight:700;}
  .cal-msel{outline:2px solid var(--brand);}
  .cal-mhas{position:relative;}
  .cal-mhas::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--brand);}
  .cal-hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6;}
  .cal-right{flex:1;min-width:440px;}
  .cal-big{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .cal-chead{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600;}
  .cal-cell{background:#fbfcfe;border:1px solid var(--line);border-radius:11px;aspect-ratio:1;padding:8px 8px 10px;position:relative;transition:.15s;overflow:hidden;}
  .cal-cell:hover{border-color:#d7ddf0;box-shadow:0 4px 14px rgba(20,30,60,.05);}
  .cal-empty{background:transparent;border:none;box-shadow:none;}
  .cal-today{border-color:var(--brand);background:#f5f8ff;}
  .cal-today .cal-d{color:var(--brand);font-weight:800;}
  .cal-sel{outline:2px solid var(--brand);}
  .cal-cnum{position:absolute;top:6px;left:8px;display:flex;align-items:baseline;gap:5px;z-index:2;}
  .cal-d{font-size:13px;font-weight:700;color:#475569;}
  .cal-lunar{font-size:10px;color:var(--muted);}
  .cal-add{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--brand);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.12s;opacity:0;}
  .cal-add:hover{opacity:1;background:var(--brand);color:#fff;border-color:var(--brand);}
  .cal-items{margin-top:26px;display:flex;flex-direction:column;gap:4px;max-height:calc(100% - 26px);overflow-y:auto;align-items:stretch;}
  .cal-it{display:flex;align-items:center;gap:4px;font-size:12px;background:#eef0ff;border-radius:7px;padding:3px 6px;cursor:pointer;transition:.12s;}
  .cal-it:hover{background:#e0e4ff;}
  .cal-it-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155;text-align:left;}
  .cal-it-del{color:#94a3b8;font-size:11px;flex:none;padding:0 2px;}
  .cal-it-del:hover{color:#dc2626;}
  .rem-orange{color:#b45309;}
  .rem-red{color:#b91c1c;}
  .rem-purple{color:#7c3aed;}
  .cal-bell{border:none;background:transparent;cursor:pointer;font-size:14px;padding:0 2px;color:#f59e0b;flex:none;line-height:1;}
  .cal-bell:hover{color:#dc2626;}
  @media(max-width:760px){ .cal-right{min-width:100%;} .cal-left{width:100%;} }

  /* 弹窗：时间双下拉 + 内联复选框 */
  .time-row{display:flex;align-items:center;gap:6px;}
  .time-field{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .time-row select{width:auto;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;outline:none;}
  .time-row select:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .inline-chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#475069;font-weight:600;margin-left:14px;}

  .chip.type{background:#eaf1ff;color:#2563eb;}
  .chip.scene{background:#eafaf1;color:#16a34a;}
  .chip.kw{background:#f1f3f8;color:#64748b;}
  .chip.sub{background:#f5f0ff;color:#7c3aed;}
  .item .quote{margin:8px 0;padding:9px 13px;border-left:3px solid var(--brand);background:#fbfaff;border-radius:0 9px 9px 0;font-size:13px;color:#3a3f55;line-height:1.65;font-style:italic;}
  .item .snippet{margin:6px 0 2px;padding:7px 11px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;color:#92400e;line-height:1.6;}
  .item .snippet b{color:#b45309;}
  .item mark{background:#fff1a8;color:#7c2d12;padding:0 2px;border-radius:3px;font-weight:600;}
  .item .meta.orig{background:#f8fafc;padding:8px 11px;border-radius:9px;max-height:120px;overflow:auto;}
  .item .meta.muted{color:#9aa3b2;}

  /* article input form */
  .article-form{padding:6px 2px 4px;}
  .article-form label{display:block;font-size:12.5px;font-weight:600;color:#475069;margin:14px 0 6px;}
  .article-form label .req{color:#ef4444;margin-left:2px;}
  .article-form .inp,.article-form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;outline:none;transition:.15s;box-sizing:border-box;}
  .article-form .inp:focus,.article-form textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .article-form textarea{resize:vertical;line-height:1.65;}
  .article-form .form-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;}
  .article-form .hint-box{margin-top:16px;padding:12px 14px;background:#f5f3ff;border:1px solid #e9e5ff;border-radius:10px;font-size:12.5px;color:#5b4db2;line-height:1.65;}
  .multi-toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#475069;cursor:pointer;user-select:none;}
  .multi-toggle input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;}
  .multi-toggle input:checked + span{color:var(--brand);}

  /* progress */
  .prog{height:8px;background:#eef1f7;border-radius:999px;overflow:hidden;margin-top:9px;}
  .prog > span{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);}
  .prog-label{font-size:12px;color:var(--muted);margin-top:5px;}

  /* todo */
  .todo{display:flex;align-items:center;gap:12px;background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;}
  .todo.done{opacity:.55;}
  .todo.done .todo-text{text-decoration:line-through;}
  .check{width:21px;height:21px;border-radius:7px;border:2px solid #c7cde0;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:.15s;}
  .check.on{background:var(--brand);border-color:var(--brand);color:#fff;font-size:13px;}
  .todo-text{flex:1;font-size:14px;}
  .inline-add{display:flex;gap:9px;margin-top:6px;}
  .inline-add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .inline-add input:focus{border-color:var(--brand);}

  /* todo 卡片式 */
  .todo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:13px;margin-top:12px;}
  .tcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .tcard.done{opacity:.6;background:#f8fafc;}
  .tcard.done .tcontent{text-decoration:line-through;}
  .tcard-top{display:flex;align-items:center;gap:9px;}
  .tcheck{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:0 0 auto;transition:.15s;}
  .tcheck.on{background:#22c55e;border-color:#22c55e;}
  .tcontent{width:100%;border:none;resize:vertical;font-family:inherit;font-size:14px;line-height:1.55;min-height:44px;background:transparent;outline:none;color:#0f172a;}
  .tcontent:focus{background:#f1f5f9;border-radius:8px;padding:6px 8px;}
  .tdeadline{display:flex;align-items:center;gap:7px;font-size:12px;color:#64748b;}
  .tdeadline input{font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;color:#334155;background:#f8fafc;}
  .tnote{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.55;min-height:50px;resize:vertical;background:#f8fafc;color:#334155;outline:none;}
  .tnote:focus{background:#fff;border-color:#93c5fd;}
  .itype{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12px;color:#334155;background:#f8fafc;max-width:175px;}
  .itype:focus{border-color:#93c5fd;background:#fff;}

  /* 愿望清单（列表式：输入框 + 许愿按钮 + 每行愿望 + 勾选实现） */
  .wish-add{display:flex;gap:9px;margin-top:4px;}
  .wish-add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .wish-add input:focus{border-color:var(--brand);}
  .btn.primary{background:var(--brand);color:#fff;border:none;}
  .btn.primary:hover{filter:brightness(1.05);}
  .wish-list{margin-top:14px;display:flex;flex-direction:column;}
  .wish-item{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:10px;transition:background .12s;}
  .wish-item:hover{background:#f8fafc;}
  .wish-check{width:18px;height:18px;flex:0 0 auto;cursor:pointer;accent-color:var(--brand);margin:0;}
  .wish-text{flex:1;font-size:15px;color:#0f172a;line-height:1.5;word-break:break-word;}
  .wish-item.done .wish-text{text-decoration:line-through;color:#94a3b8;}
  .wish-date{flex:0 0 auto;font-size:12px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .wish-del{flex:0 0 auto;opacity:0;border:none;background:transparent;color:#cbd5e1;font-size:19px;cursor:pointer;line-height:1;padding:0 6px 2px;border-radius:6px;transition:.12s;}
  .wish-item:hover .wish-del{opacity:1;}
  .wish-del:hover{color:#dc2626;background:#fee2e2;}

  /* todos 三列：未完成项 / 今日待办 / 明日计划 */
  .todos-3col{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:16px;align-items:start;margin-top:2px;}
  .tcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);}
  .tcol.mid{box-shadow:0 6px 20px rgba(14,165,233,.10);border-color:#bfe3f5;}
  .tcol.side{margin-top:40px;}                       /* 左/右两列整体下移 */
  .tcol.side .tcol-h{flex-direction:column;align-items:center;justify-content:center;gap:6px;}  /* 标题居中 */
  .tcol-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .tcol-h .th-t{font-weight:700;font-size:14.5px;}
  .tcol-h .th-n{font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:999px;padding:1px 9px;min-width:22px;text-align:center;}
  .tcol-h .th-n.warn{background:#ef4444;}
  /* 中间：今日待办 */
  .tm-date{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .tm-date b{color:#0f172a;font-size:15px;font-weight:700;margin-right:6px;}
  .tm-title{text-align:center;font-weight:700;font-size:16px;margin-bottom:10px;color:var(--brand);}
  .todo-add{display:flex;gap:9px;margin-bottom:12px;align-items:center;}
  .todo-add .ti{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .todo-add .ti:focus{border-color:var(--brand);}
  .tm-list{display:flex;flex-direction:column;gap:8px;}
  .tm-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;transition:.12s;}
  .tm-row:hover{background:#f8fafc;}
  .tm-row.done{background:#f8fafc;opacity:.75;}
  .tm-main{flex:1;min-width:0;}
  .tm-text{font-size:14px;line-height:1.5;word-break:break-word;cursor:text;outline:none;}
  .tm-text:focus{background:#f1f5f9;border-radius:6px;padding:3px 6px;}
  .tm-row.done .tm-text{text-decoration:line-through;color:#94a3b8;}
  .tm-note-line{font-size:12.5px;color:#64748b;margin-top:4px;line-height:1.5;word-break:break-word;}
  .tm-note-ph{color:#cbd5e1;font-size:12.5px;}
  .tm-deadline{flex:0 0 auto;align-self:center;}
  .tm-deadline input{font-family:inherit;border:1px solid transparent;border-radius:8px;padding:4px 6px;font-size:12.5px;color:#475569;background:#f1f5f9;cursor:pointer;transition:.12s;max-width:128px;}
  .tm-deadline input:hover{border-color:#93c5fd;background:#eaf2ff;}
  .tm-actions{flex:0 0 auto;align-self:center;display:flex;gap:2px;align-items:center;}
  .tm-notebtn{border:none;background:transparent;cursor:pointer;font-size:14px;line-height:1;padding:5px;border-radius:7px;color:#94a3b8;transition:.12s;}
  .tm-notebtn:hover{background:#eef2ff;color:#6366f1;}
  .tm-notebtn.has{color:#6366f1;}
  .tm-del{border:none;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:5px;border-radius:7px;color:#cbd5e1;transition:.12s;}
  .tm-del:hover{background:#fee2e2;color:#ef4444;}
  .tm-note-edit{width:100%;border:1px solid #93c5fd;border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px;line-height:1.5;resize:vertical;min-height:46px;background:#fff;outline:none;margin-top:5px;}
  /* 侧栏：未完成项 / 明日计划 */
  .ts-list{display:flex;flex-direction:column;gap:8px;}
  .ts-row{display:flex;align-items:flex-start;gap:9px;padding:9px 6px 9px 10px;border-radius:10px;transition:background .12s;}
  .ts-row:hover{background:#f8fafc;}
  .ts-row.ro{opacity:.92;}
  .ts-main{flex:1;min-width:0;}
  .ts-text{font-size:13.5px;line-height:1.5;word-break:break-word;color:#334155;}
  .ts-deadline{font-size:11.5px;color:#94a3b8;margin-top:3px;}
  .ts-note-line{font-size:12px;color:#64748b;margin-top:3px;line-height:1.5;word-break:break-word;}
  .ts-del{border:none;background:transparent;cursor:pointer;font-size:14px;line-height:1;padding:4px 5px;border-radius:7px;color:#cbd5e1;transition:.12s;align-self:center;}
  .ts-del:hover{background:#fee2e2;color:#ef4444;}
  .ts-move{border:none;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:4px 5px;border-radius:7px;color:#cbd5e1;transition:.12s;align-self:center;}
  .ts-move:hover{background:#dcfce7;color:#10b981;}
  .empty.sm{color:#94a3b8;font-size:12.5px;text-align:center;padding:14px 0;}
  @media(max-width:780px){ .todos-3col{grid-template-columns:1fr;} }

  /* habits */
  .streak{font-size:12px;color:var(--muted);}
  .streak b{color:#10b981;}
  .mo-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 10px;}
  .mo-label{font-size:13px;font-weight:650;color:#475069;}
  .mo-nav .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .habit-head{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding:0 2px;}
  .habit-head .nh{flex:0 0 150px;font-size:11px;color:var(--muted);font-weight:600;}
  .habit-head .daynums{flex:1;display:flex;gap:3px;}
  .habit-head .daynums i{flex:1;text-align:center;font-style:normal;font-size:10px;color:var(--muted);font-weight:600;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.05;padding:1px 0;border-radius:6px 6px 0 0;}
  .habit-head .daynums i .dn{font-size:10px;}
  .habit-head .daynums i .dw{font-size:9px;color:#9aa3b8;}
  .habit-head .daynums i.we{background:#fdecec;}
  .habit-head .daynums i.we .dw{color:#ef4444;font-weight:700;}
  .habit-head .ph{flex:0 0 52px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;}
  .habit-head .dh{flex:0 0 28px;}
  .habit-row{display:flex;align-items:center;gap:6px;padding:9px 2px;border-top:1px solid var(--line);}
  .habit-row:first-of-type{border-top:none;}
  .habit-prog{flex:0 0 52px;text-align:center;font-size:13.5px;font-weight:800;color:#047857;background:#d1fae5;border:1px solid #6ee7b7;border-radius:20px;padding:5px 0;box-sizing:border-box;letter-spacing:.3px;}
  .habit-nm{flex:0 0 150px;font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit-days{flex:1;min-width:0;display:flex;gap:3px;}
  .habit-days .cell{height:26px;border-radius:7px;background:#eef1f7;cursor:pointer;display:grid;place-items:center;font-size:12px;transition:.12s;flex:1;min-width:0;}
  .habit-days .cell.we{background:#fdecec;}
  .habit-days .cell.on{background:#10b981;color:#fff;}
  .habit-days .cell.today{box-shadow:0 0 0 2px #f59e0b inset;}
  .habit-days .cell.disabled{cursor:not-allowed;opacity:.5;}
  .habit-del{flex:0 0 28px;text-align:center;border:none;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:6px;border-radius:8px;color:#cbd2e0;transition:.12s;}
  .habit-del:hover{background:#fee2e2;color:#ef4444;}

  /* review */
  textarea.note{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:inherit;font-size:14px;line-height:1.75;outline:none;resize:vertical;background:#fff;color:var(--ink);}
  textarea.note:focus{border-color:var(--brand);}
  .review-list{margin-top:16px;}
  .review-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;cursor:pointer;background:#fbfcfe;}
  .review-item:hover{border-color:#d7ddf0;}
  .review-item .rd{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .review-item .rs{font-size:13.5px;color:#475069;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* dashboard stat cards */
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;}
  .stat:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,30,60,.1);}
  .stat .lab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .stat .num{font-size:30px;font-weight:800;margin-top:8px;line-height:1;}
  .stat .desc{font-size:12px;color:var(--muted);margin-top:6px;}

  /* 录入表待处理提醒框 */
  .pending-banner{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);transition:.15s;}
  .pending-banner.warn{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;cursor:pointer;}
  .pending-banner.warn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(234,88,12,.12);}
  .pending-banner.ok{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;cursor:default;}
  .pending-banner .pb-ic{font-size:30px;flex:0 0 auto;line-height:1;}
  .pending-banner .pb-txt{font-size:14px;color:#475069;line-height:1.65;}
  .pending-banner.warn .pb-txt b{color:#ea580c;font-size:20px;font-weight:800;margin:0 2px;}
  .pending-banner .pb-link{color:var(--brand);font-weight:600;}

  /* 灵感库：筛选 + 搜索工具栏 */
  .wisdom-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px;align-items:center;}
  .wisdom-toolbar .inp{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;outline:none;font-family:inherit;box-sizing:border-box;}
  .wisdom-toolbar .inp:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .wisdom-toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-family:inherit;color:#475069;outline:none;max-width:160px;cursor:pointer;}
  .wisdom-toolbar select:focus{border-color:#a5b4fc;}
  /* 搜索框 + 搜索按钮并排；输入不打断，点击/回车才筛选 */
  .wisdom-toolbar .search-wrap{display:flex;gap:8px;flex:1;min-width:260px;}
  .wisdom-toolbar .search-wrap .inp{flex:1;min-width:0;}
  .wisdom-toolbar .search-wrap .btn{flex:0 0 auto;padding:9px 16px;white-space:nowrap;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .wisdom-toolbar .search-wrap .btn:hover{opacity:.92;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;width:min(460px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#475069;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);}
  .field textarea{min-height:84px;resize:vertical;}
  /* 灵感库详情：原始文案上移并加宽一倍（弹窗整体加宽） */
  .modal.wide{width:min(720px,100%);}
  .field.fullw textarea{min-height:220px;font-size:14px;line-height:1.7;}
  /* 每日日记：4 个分类/标签下拉 2×2 布局 */
  .cat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:6px 0 2px;}
  .cat-row .field{margin-bottom:0;}
  .modal-ops{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .muted{color:var(--muted);}
  /* 下拉「＋ 新增分类」内联输入框 */
  .add-row{display:flex;gap:6px;align-items:center;}
  .add-row input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card);color:var(--text);}
  /* 年度计划：年份切换（.annual-yearbar 由「年度计划」复用） */
  .annual-yearbar{display:flex;align-items:center;gap:16px;margin:6px 0 16px;}
  .annual-yearbar .yr{flex:1;text-align:center;font-size:25px;font-weight:800;letter-spacing:1px;color:var(--ink);}
  .annual-yearbar .yrbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);transition:.15s;flex:0 0 auto;}
  .annual-yearbar .yrbtn:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
  @media(max-width:900px){.cols-2,.cols-3{grid-template-columns:1fr;}.sidebar{display:none;}}
  /* 写日记 */
  .diary-layout{display:flex; gap:18px; align-items:flex-start;}
  .diary-main{flex:1; min-width:0;}
  .diary-side{width:300px; flex:0 0 300px; max-width:42%;}
  @media (max-width:760px){ .diary-layout{flex-direction:column;} .diary-side{width:100%; max-width:100%;} }
  .diary-card .h{display:flex; align-items:center; justify-content:space-between;}
  .diary-cal{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); width:100%; max-width:100%; overflow:hidden;}
  .cal-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-title{font-weight:700; font-size:15px; color:var(--ink);}
  .cal-week{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-bottom:4px; width:100%;}
  .cal-week span{text-align:center; font-size:12px; color:var(--muted); padding:2px 0;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:34px; gap:4px; width:100%;}
  .cal-cell{position:relative; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:9px; background:var(--line2); color:var(--ink); cursor:default; user-select:none; overflow:hidden;}
  .cal-cell.empty{background:transparent;}
  .cal-cell.future{color:var(--muted); opacity:.5;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--brand); font-weight:700;}
  .cal-cell.green{background:#dcfce7; color:#15803d; font-weight:700; cursor:pointer;}
  .cal-cell.green:hover{background:#bbf7d0;}
  .cal-dot{position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:#16a34a;}
  .cal-legend{margin-top:10px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .lg.green{width:12px; height:12px; border-radius:4px; background:#dcfce7; display:inline-block;}
  .diary-write .dw-meta{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; margin-bottom:12px;}
  .dw-date{display:flex; align-items:center; gap:8px; font-size:15px;}
  .dw-picks{flex:1; min-width:220px; display:flex; flex-direction:column; gap:10px;}
  .pick-label{font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .wrow,.mrow{display:flex; flex-wrap:wrap; gap:6px;}
  .wchip,.mchip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:13px; cursor:pointer; color:var(--ink); transition:.15s; font-family:inherit;}
  .wchip:hover,.mchip:hover{border-color:var(--brand);}
  .wchip.on,.mchip.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .diary-write .note{margin-top:4px;}
  .diary-done .dd-row{display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line);}
  .diary-done .dd-k{color:var(--muted); font-size:13px; width:64px; flex:0 0 64px;}
  .diary-done .dd-v{font-size:15px; font-weight:600;}
  .diary-done .dd-content{margin-top:14px; white-space:pre-wrap; line-height:1.8; font-size:15px; background:var(--line2); border-radius:12px; padding:14px 16px;}
  .diary-done .dd-note{margin-top:14px; color:#15803d; font-size:13px; background:#dcfce7; border-radius:10px; padding:10px 12px;}
  .diary-view h3{margin:0 0 12px; color:var(--ink);}
  .diary-view .dv-meta{display:flex; gap:8px; margin-bottom:12px;}
  .diary-view .dv-pill{background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:600;}
  .diary-view .dv-content{white-space:pre-wrap; line-height:1.8; font-size:15px; background:var(--line2); border-radius:12px; padding:14px 16px;}

  /* ===================== 年度计划 2.0 ===================== */
  .annual2{display:flex; flex-direction:column;}
  .a2-cell{position:relative; box-sizing:border-box; border:1px solid var(--line); min-height:56px; padding:14px 18px; overflow:hidden;}
  .a2-opening, .a2-ending{width:100%;}
  .a2-text{outline:none; min-height:24px; white-space:pre-wrap; word-break:break-word; line-height:1.7; font-size:15px;}
  .a2-title{display:flex; align-items:center; justify-content:center; text-align:center; min-height:50px; font-weight:800; font-size:18px; position:relative; padding-left:28px; padding-right:40px; box-sizing:border-box;}
  .a2-title .a2-text{text-align:center; width:100%; min-width:0; box-sizing:border-box; white-space:normal;}
  .a2-main{display:flex; align-items:stretch; gap:0; margin-top:0;}
  .a2-groups{display:grid; grid-template-columns:repeat(2,1fr); gap:0; align-items:stretch; flex:1; min-width:0;}
  .a2-group{display:flex; flex-direction:column; min-width:0; box-sizing:border-box;}
  .a2-content{flex:1; display:flex; flex-direction:column; padding:10px 12px; min-height:56px;}
  .a2-item{display:flex; align-items:flex-start; gap:8px; padding:6px 2px; border-bottom:1px dashed var(--line);}
  .a2-item:last-child{border-bottom:none;}
  .a2-check{margin-top:4px; flex:0 0 auto; width:16px; height:16px; cursor:pointer;}
  .a2-item-text{flex:1; outline:none; min-height:20px; white-space:pre-wrap; word-break:break-word; line-height:1.7; font-size:14px;}
  .a2-actions{position:absolute; top:6px; right:6px; display:flex; gap:4px; z-index:5;}
  .a2-btn{width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,.8); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--ink); flex:0 0 auto; line-height:1;}
  .a2-btn:hover{background:#fff; border-color:var(--brand);}
  .a2-fill:hover{border-color:#f59e0b; background:#fffbeb;}
  .a2-del:hover{border-color:#ef4444; color:#ef4444; background:#fef2f2;}
  .a2-add-item{margin-top:8px; text-align:center; color:var(--brand); cursor:pointer; font-size:13px; padding:7px; border:1px dashed var(--brand-soft); border-radius:8px;}
  .a2-add-item:hover{background:var(--brand-soft);}
  .a2-addgroup{flex:0 0 44px; margin-left:8px; border:1px dashed var(--brand); border-radius:10px; background:#fff; color:var(--brand); font-size:24px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .a2-addgroup:hover{background:var(--brand-soft);}
  .a2-addgroup-wrap{margin-top:10px; display:flex; justify-content:flex-end;}
  .a2-arrange{margin-top:14px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .a2-arrange input{width:56px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-family:inherit;}
  .a2-pop{position:fixed; z-index:300; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 10px 34px rgba(0,0,0,.2); display:flex; flex-direction:column; gap:10px;}
  .a2-pop label{font-size:13px; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .a2-pop input[type=color]{width:42px; height:28px; border:1px solid var(--line); border-radius:6px; background:none; cursor:pointer; padding:0;}
  .a2-pop-btns{display:flex; gap:8px; justify-content:flex-end;}
  .a2-pop-btns button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 12px; cursor:pointer; font-family:inherit; font-size:13px;}
  .a2-pop-btns button.primary{background:var(--brand); color:#fff; border-color:var(--brand);}
  .a2-pop-row{display:flex; flex-direction:column; gap:6px;}
  .a2-pop-label{font-size:13px; color:var(--muted);}

  .a2-sw{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); cursor:pointer; padding:0;}

  .btn.danger{background:#ef4444; border-color:#ef4444; color:#fff;}

  /* ===================== 任务思维导图（竖状树形 + 行内操作） ===================== */
  .mindmap{margin-top:6px; border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:#fff;}

  .mm-row{display:flex; align-items:center; gap:8px; padding:4px 0; flex-wrap:nowrap;}

  .mm-title{font-weight:600; color:var(--ink); flex:none; min-width:0; word-break:break-word; max-width:340px;}
  .mm-title.root-title{font-size:16px; font-weight:800;}
  .mm-title[contenteditable="true"]{outline:2px solid var(--brand); border-radius:6px; padding:2px 6px; background:#fff; min-width:80px; max-width:440px;}

  .mm-status{border:1px solid #fcd34d; background:#fef3c7; color:#92400e; border-radius:999px; padding:2px 11px; font-size:12px; font-weight:700; cursor:pointer; flex:none; white-space:nowrap;}

  .mm-ic{border:none; background:transparent; cursor:pointer; font-size:14px; line-height:1; padding:4px 5px; border-radius:6px; color:#94a3b8; transition:.12s;}
  .mm-ic:hover{background:#eef2f7; color:#334155;}
  .mm-daily-chk{display:inline-flex; align-items:center; flex:none; cursor:pointer;}
  .mm-daily-chk input{width:15px; height:15px; cursor:pointer; accent-color:#7c3aed;}

  .mm-dl{display:inline-flex; align-items:center; gap:3px; flex:none;}
  .mm-date{border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:12px; color:#334155; background:#fff;}
  .mm-date.today{border-color:#fb923c; background:#fff7ed;}
  .mm-date.overdue{border-color:#ef4444; background:#fef2f2; color:#b91c1c; font-weight:600;}
  .mm-date.done{border-color:#86efac; background:#f0fdf4; color:#166534;}
  .mm-cal{cursor:pointer; font-size:13px;}
  .mm-note{margin:2px 0 4px 24px; padding:6px 10px; background:#f8fafc; border-left:3px solid #e2e8f0; border-radius:0 8px 8px 0; color:#475569; font-size:13px; white-space:pre-wrap; line-height:1.55;}
  .mm-note[contenteditable="true"]{outline:2px solid var(--brand); background:#fff; border-radius:6px;}
  .mm-node.collapsed > .mm-children{display:none;}
  .title-combo{display:flex; gap:8px; align-items:center;}
  .title-combo input{flex:1; min-width:0;}
  .title-combo select{flex:none; width:auto; min-width:170px;}


  /* ===================== 月度计划 2.0 ===================== */
  .mp2{display:flex; flex-direction:column; gap:14px;}
  .mp2-topbar{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 2px;}
  .mp2-nav{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--brand); font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .mp2-nav:hover{background:var(--brand-soft);}
  .mp2-title{font-size:20px; font-weight:800; letter-spacing:.5px; min-width:200px; text-align:center;}
  .mp2-table{border-collapse:collapse; width:100%; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .mp2-table th, .mp2-table td{border:1px solid var(--line); padding:10px 12px; vertical-align:top; text-align:left; font-size:14px;}
  .mp2-table th{background:var(--brand-soft); color:var(--brand); font-weight:700; text-align:center; white-space:nowrap;}
  .mp2-table th:nth-child(1){width:54px;}
  .mp2-table th:nth-child(2){width:150px;}
  .mp2-table th:nth-child(4){width:90px;}
  .mp2-table th:nth-child(5){width:160px;}
  .mp2-table th:nth-child(6){width:120px;}
  .col-seq{text-align:center; font-weight:800; font-size:16px; color:var(--brand); background:var(--brand-soft); vertical-align:middle;}
  .col-item{background:var(--bg); text-align:center; vertical-align:middle;}
  .mp2-item{outline:none; min-height:22px; white-space:pre-wrap; word-break:break-word; line-height:1.6; font-weight:600; cursor:text; text-align:center;}
  .mp2-content{outline:none; min-height:22px; white-space:pre-wrap; word-break:break-word; line-height:1.6; cursor:text;}
  .col-content, .col-deadline{border-left:3px solid transparent;}
  .col-daily{text-align:center; vertical-align:middle;}
  .mp2-date{border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:13px; background:#fff; color:#0f172a; width:100%; box-sizing:border-box;}
  .mp2-date:disabled{background:#f1f5f9; color:#94a3b8; cursor:not-allowed;}
  .mp2-date-empty{display:inline-block; color:var(--muted); font-size:13px; padding:6px 0;}
  .col-done{text-align:center; white-space:nowrap; vertical-align:middle;}
  .mp2-check{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border:2px solid var(--muted); border-radius:6px; cursor:pointer; font-weight:800; color:transparent; user-select:none; transition:.15s;}
  .mp2-check:hover{border-color:var(--brand);}
  .mp2-check.on{background:#22c55e; border-color:#22c55e; color:#fff;}
  .mp2-daily.on{background:#0ea5e9; border-color:#0ea5e9; color:#fff;}
  .col-del{border:none; background:transparent; width:34px; text-align:center; vertical-align:middle; padding-left:12px;}
  .mp2-table th:last-child{border:none; background:transparent;}
  .mp2-del{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:6px; border-radius:8px; transition:.12s;}
  .mp2-del:hover{background:#fee2e2; color:#ef4444;}
  .mp2-empty{text-align:center; color:var(--muted); padding:24px;}
  /* 颜色标记：完成绿 / 今日橙 / 超期红（作用于 计划内容 + 截止时间 两列） */
  .mp2-green.col-content, .mp2-green.col-deadline{background:#dcfce7; border-left-color:#22c55e;}
  .mp2-orange.col-content, .mp2-orange.col-deadline{background:#ffedd5; border-left-color:#f97316;}
  .mp2-red.col-content, .mp2-red.col-deadline{background:#fee2e2; border-left-color:#ef4444;}
  .mp2-add{margin:2px auto 0; width:fit-content; padding:10px 22px; border:1.5px dashed var(--brand); color:var(--brand); border-radius:12px; cursor:pointer; font-weight:700; background:var(--card);}
  .mp2-add:hover{background:var(--brand-soft);}
  .mp2-hint{font-size:12px; color:var(--muted); margin:4px 0 2px; line-height:1.5;}
  .mp2-seq-input{width:120px;}
</style>

<body>
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">🪷</div>
    <h2>傅傅的工作台</h2>
    <p class="gate-sub">请输入访问密码</p>
    <input id="gatePwd" type="password" placeholder="访问密码" autocomplete="off" />
    <button id="gateBtn">进入</button>
    <div id="gateErr" class="gate-err"></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🪄</div>
      <div>
        <div class="name">傅傅的工作台</div>
        <div class="sub">Personal Ops Center</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <div class="page-title" id="pageTitle"></div>
        <div class="page-hint" id="pageHint"></div>
      </div>
      <div class="topbar-right">
        <button class="sync-btn" id="syncBtn" onclick="syncNow()" title="把本地修改同步到飞书，并拉取飞书上的外部变更（双向同步，本地修改优先）">
          <span class="sync-ic" id="syncIcon">🔄</span><span id="syncLabel">同步</span><span class="sync-badge" id="syncBadge" style="display:none">0</span>
        </button>
        <div class="date-pill" id="datePill"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ---------- data layer (飞书 API) ---------- */
const API = '/api';
const cache = {};
async function apiJson(url, opts){
  const r = await fetch(API+url, opts||{});
  if(r.status===401){ showGate(); throw new Error('需要重新输入访问密码'); }
  const j = await r.json().catch(()=>({}));
  // ⚠️ 服务端出错（如 500）时必须抛错，否则写入失败会被静默吞掉、弹窗关闭却数据丢失且无提示
  if(!r.ok) throw new Error((j && (j.error||j.msg)) || ('请求失败 ('+r.status+')'));
  return j;
}
// 本地优先：读/写先走 IndexedDB（瞬时），写标记 dirty；「同步」按钮再与飞书双向同步。
// 项目 / 重大事项思维导图(ptask) 仍走网络（其读路径是 /project，不在本地缓存范围内）。
const apiList   = id => localList(id);
const apiCreate = (id,obj) => localCreate(id, obj);
const apiUpdate = (id,rec,obj) => localUpdate(id, rec, obj);
const apiDelete = (id,rec) => localDelete(id, rec);
// 网络版（本地数据库不可用时降级 / 同步推送用）
const _netList = id => apiJson('/section/'+id);
const _netCreate = (id,obj) => apiJson('/section/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
const _netUpdate = (id,rec,obj) => apiJson('/section/'+id+'/'+rec,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
const _netDelete = (id,rec) => apiJson('/section/'+id+'/'+rec,{method:'DELETE'});
// 微习惯：本地优先；habits(微习惯表) + habitChecks(习惯打卡表) 两个本地桶，读时客户端重组 {id,name,history}
async function apiHabits(){
  const hs = await localList('habits');
  const cs = await localList('habitChecks');
  const byH = {};
  cs.forEach(c=>{ if(!c.habit) return; if(!byH[c.habit]) byH[c.habit]={}; if(c.checked) byH[c.habit][c.date]=true; });
  return hs.map(h=>({ id:h.id, name:h.name||'', history: byH[h.id]||{} }));
}
async function addHabitApi(name){ return localCreate('habits', { name }); }
async function delHabitApi(id){
  await localDelete('habits', id);
  const all = await idbAll();
  const checks = all.filter(d=> d.sectionId==='habitChecks' && d.data && d.data.habit===id && d._op!=='delete');
  for(const c of checks){ await localDelete('habitChecks', c.id); }
  return { ok:true };
}
async function toggleHabitApi(hid, dy){
  // 确保该习惯已落到飞书（拿到真实 record_id），否则打卡记录的关联字段会指向本地 uuid 而失效
  let habitDoc = (await idbAll()).find(d=> d.sectionId==='habits' && d._op!=='delete' && (d.id===hid || d.realId===hid));
  if(habitDoc && !habitDoc.realId){
    try{
      const r = await _netCreate('habits', habitDoc.payload);
      const realId = (r && r.id) || '';
      if(realId){
        const oldKey = habitDoc.key;
        habitDoc.realId = realId; habitDoc.id = realId; habitDoc.data = Object.assign({}, habitDoc.data, { id: realId }); habitDoc._op='sync'; habitDoc._dirty=false; habitDoc._ts=0; habitDoc.key = lkey('habits', realId);
        await idbDelete(oldKey); await idbPut(habitDoc);
        hid = realId;
      }
    }catch(e){ console.warn('微习惯预同步失败，打卡将暂存本地 uuid：', e.message); }
  }
  // 本地切换打卡
  const cs = await localList('habitChecks');
  const existing = cs.find(c=> (c.habit===hid) && c.date===dy);
  if(existing){ await localDelete('habitChecks', existing.id); }
  else { await localCreate('habitChecks', { habit: hid, date: dy, checked: true }); }
  return { ok:true };
}
const apiReview = () => localList('review');
const apiDiary = () => localList('diary');
const apiProject = section => apiJson('/project/'+section);
const apiSaveProjectDesc = (section,desc) => apiJson('/project-desc',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({section,desc})});
const apiEnsureMajor = recId => apiJson('/major-ensure/'+recId,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});

/* ===================== 本地优先数据层 (IndexedDB) ===================== */
const DB_NAME = 'fufu_workbench', DB_VER = 1, STORE = 'records';
let _db = null, _dbPromise = null, _dbOk = true;
function openDB(){
  if(_dbPromise) return _dbPromise;
  if(!window.indexedDB) { _dbOk = false; return Promise.reject(new Error('浏览器不支持 IndexedDB')); }
  _dbPromise = new Promise((res, rej)=>{
    try{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e=>{ const db = e.target.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'key' }); };
      req.onsuccess = e=>{ _db = e.target.result; _dbOk = true; res(_db); };
      req.onerror = e=>{ _dbOk = false; rej(e.target.error); };
    }catch(e){ _dbOk = false; rej(e); }
  });
  return _dbPromise;
}
async function idbAll(){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const r=tx.objectStore(STORE).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
async function idbPut(doc){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(doc); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbDelete(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const r=tx.objectStore(STORE).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
// 项目说明(desc) 离线缓存：先读本地，再后台刷新飞书并回写本地
async function loadProjDesc(secId){
  const cached = await idbGet(lkey('__desc__', secId));
  let desc = cached && cached.data ? (cached.data.desc||'') : '';
  try { const d = await apiProject(secId); desc = (d && d.desc) || ''; await idbPut({ key:lkey('__desc__', secId), sectionId:'__desc__', id:secId, data:{desc}, _op:'sync', _dirty:false, _ts:0 }); }
  catch(e){ /* 离线：用缓存 */ }
  return desc;
}

const uuid = () => 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
// 人生灵感库(wisdom) 与所有知识库分类页(kbcat/knowledge) 同源「人生灵感库」表 → 统一存到 'inspiration' 本地桶
function localSection(id){ const k = SECTIONS[id] && SECTIONS[id].kind; return (k==='wisdom'||k==='knowledge'||k==='kbcat') ? 'inspiration' : id; }
function lkey(sec, id){ return sec + '::' + id; }
// 项目(ptask 思维导图) 已纳入本地优先缓存 + 双向同步（与年/月计划等一致）；
// 父子关联靠 tid：离线时本地分配 L 前缀临时 tid 建树，同步后回写真实 tid 并修正子任务指向。
function localExcluded(id){ return false; }
const BACKED_KINDS = ['events','todos','wisdom','knowledge','kbcat','topics','publish','books','wishes','insprec','calendar','annual2','monthplan2','review','diary','habits','habitCheck','project','ptask'];
function sectionBacked(id){ const s = SECTIONS[id]; return s && BACKED_KINDS.includes(s.kind); }
// ptask 类（project / ptask）通用判断与 tid 工具
function isPtaskKind(k){ return k==='project' || k==='ptask'; }
function isRealTid(v){ return v!=null && v!=='' && /^\d+$/.test(String(v)); }
const txt = v => (v && typeof v==='object') ? (v.text||'') : (v||'');
// 人生灵感库：飞书中文键 → 前端友好字段
function wisdomFromFeishu(f){ if(!f||typeof f!=='object') return {}; const g=k=>f[k]||''; return {
  title:g('文案标题'), cat1:txt(g('一级分类')), cat2:txt(g('二级分类')), cat3:txt(g('三级分类')),
  tag:txt(g('标签')), keywords:g('关键词'), ctype:txt(g('内容类型')), status:txt(g('是否整理')),
  date:g('收藏日期')||'', source:g('来源'), sourceLink:g('来源链接'), summary:g('AI总结'),
  quote:g('金句提炼'), original:g('原始文案'), abstract:g('AI搜索摘要'), reflection:g('个人感悟')
}; }
// 前端友好字段 → 飞书中文键（推送用）
function wisdomToFeishu(d){ const sel=v=>v?{text:v}:null; const g=k=>(d&&d[k]!=null?d[k]:''); return {
  '文案标题':g('title'), '一级分类':sel(g('cat1')), '二级分类':sel(g('cat2')), '三级分类':sel(g('cat3')),
  '标签':sel(g('tag')), '内容类型':sel(g('ctype')), '关键词':g('keywords'), '是否整理':sel(g('status')),
  '收藏日期':g('date')?g('date'):null, '来源':g('source'), '来源链接':g('sourceLink'),
  'AI总结':g('summary'), '金句提炼':g('quote'), '原始文案':g('original'), 'AI搜索摘要':g('abstract'), '个人感悟':g('reflection')
}; }
// 本地写入飞书时用的负载（kind 决定是否需要中文键包装）
function sectionPayload(id, data){
  const k = SECTIONS[id] && SECTIONS[id].kind;
  if(k==='wisdom') return wisdomToFeishu(data);
  if(k==='knowledge' || k==='kbcat') return { title:data.title||'', content:(data.summary!=null?data.summary:data.content)||'', source:data.source||'', tags:(data.tag!=null?data.tag:data.tags)||'' };
  return Object.assign({}, data);
}

const _seeded = {};
async function ensureLocal(sectionId){
  const sec = localSection(sectionId);
  if(_seeded[sec]) return;
  _seeded[sec] = true;
  if(localExcluded(sectionId) || !sectionBacked(sectionId)) return;
  try{
    const remote = await apiJson('/section/'+sectionId+'?full=1');
    const arr = Array.isArray(remote) ? remote : [];
    for(const it of arr){ if(!it || !it.id) continue;
      await idbPut({ key:lkey(sec,it.id), sectionId:sec, pushSection:sectionId, id:it.id, realId:it.id, data:it, _op:'sync', _dirty:false, _ts:0 });
    }
  }catch(e){ console.warn('本地缓存种子失败('+sectionId+'):', e.message); _seeded[sec]=false; }
}
async function localList(sectionId){
  if(localExcluded(sectionId) || !sectionBacked(sectionId)) return _netList(sectionId);
  await ensureLocal(sectionId);
  const sec = localSection(sectionId);
  const all = (await idbAll()).filter(d=> d.sectionId===sec && d._op!=='delete');
  all.sort((a,b)=>{ const ta=a._ts||0, tb=b._ts||0; if(ta!==tb) return tb-ta; return String(b.id).localeCompare(String(a.id)); });
  let data = all.map(d=>d.data);
  if(sec==='inspiration' && sectionId!=='inspiration'){
    const tag = SECTIONS[sectionId] && SECTIONS[sectionId].name;
    data = data.filter(x=> (x.tag||'')===tag);
  }
  return data;
}
async function localCreate(sectionId, obj){
  if(localExcluded(sectionId) || !sectionBacked(sectionId)) return _netCreate(sectionId, obj);
  const sec = localSection(sectionId);
  const id = uuid();
  const data = Object.assign({}, obj); data.id = id;
  const k = SECTIONS[sectionId] && SECTIONS[sectionId].kind;
  if(isPtaskKind(k) && !isRealTid(data.tid)) data.tid = 'L'+id; // 本地临时 tid：离线建树用，推送时剥离
  if(SECTIONS[sectionId] && (SECTIONS[sectionId].kind==='knowledge' || SECTIONS[sectionId].kind==='kbcat')){
    if(data.tags!=null && data.tag==null) data.tag = data.tags;
    if(!data.tag) data.tag = SECTIONS[sectionId].name;
  }
  const payload = sectionPayload(sectionId, data); delete payload.id;
  if(isPtaskKind(k) && !isRealTid(data.tid)) delete payload.tid; // 让后端分配真实序号
  const doc = { key:lkey(sec,id), sectionId:sec, pushSection:sectionId, id, realId:'', data, _op:'create', _dirty:true, _ts:Date.now(), payload };
  await idbPut(doc); updateSyncBadge();
  return { id };
}
async function localUpdate(sectionId, rec, obj){
  if(localExcluded(sectionId) || !sectionBacked(sectionId)) return _netUpdate(sectionId, rec, obj);
  const sec = localSection(sectionId);
  const key = lkey(sec, rec);
  const docs = (await idbAll()).filter(d=> d.key===key);
  const doc = docs[0];
  if(!doc){ // 记录不存在（如外部导入的详情），按新建处理
    const base = Object.assign({id:rec}, obj);
    if(SECTIONS[sectionId] && SECTIONS[sectionId].kind==='wisdom') Object.assign(base, wisdomFromFeishu(obj));
    return localCreate(sectionId, base);
  }
  let merged;
  if(SECTIONS[sectionId] && SECTIONS[sectionId].kind==='wisdom') merged = Object.assign({}, doc.data, wisdomFromFeishu(obj));
  else merged = Object.assign({}, doc.data, obj);
  merged.id = doc.id;
  doc.data = merged;
  doc._op = (doc._op==='create') ? 'create' : 'update';
  doc._dirty = true; doc._ts = doc._ts || Date.now();
  const payload = sectionPayload(sectionId, merged); delete payload.id;
  if(isPtaskKind(SECTIONS[sectionId] && SECTIONS[sectionId].kind) && !isRealTid(merged.tid)) delete payload.tid; // 本地 tid 不回传，让后端分配
  doc.payload = payload;
  await idbPut(doc); updateSyncBadge();
  return { ok:true };
}
async function localDelete(sectionId, rec){
  if(localExcluded(sectionId) || !sectionBacked(sectionId)) return _netDelete(sectionId, rec);
  const sec = localSection(sectionId);
  const key = lkey(sec, rec);
  const docs = (await idbAll()).filter(d=> d.key===key);
  const doc = docs[0];
  if(!doc) return { ok:true };
  if(doc._op==='create'){ await idbDelete(key); updateSyncBadge(); return { ok:true }; } // 尚未同步，直接丢弃
  doc._op='delete'; doc._dirty=true; await idbPut(doc); updateSyncBadge();
  return { ok:true };
}

/* ---- 同步：先把本地 dirty 推到飞书，再拉取外部变更（本地优先，冲突以本地为准） ---- */
async function mergePull(sec, arr){
  const remoteIds = new Set(arr.map(r=>r.id).filter(Boolean));
  const locals = (await idbAll()).filter(d=> d.sectionId===sec);
  const localByReal = {}; locals.forEach(d=>{ if(d.realId) localByReal[d.realId]=d; });
  const tidMap = {}; // 本地临时 tid -> 真实 tid（同步回写后用于修正子任务指向）
  for(const r of arr){ if(!r||!r.id) continue;
    const ex = localByReal[r.id];
    if(ex){ if(!ex._dirty){
      const oldTid = ex.data && ex.data.tid;
      if(!isRealTid(oldTid)) tidMap[String(oldTid)] = r.tid; // 记录本地→真实 tid
      ex.data=r; ex._op='sync'; ex._dirty=false; ex._ts=0; await idbPut(ex);
    } }
    else { await idbPut({ key:lkey(sec,r.id), sectionId:sec, pushSection:sec, id:r.id, realId:r.id, data:r, _op:'sync', _dirty:false, _ts:0 }); }
  }
  // 把子任务的 parent 从「本地临时 tid」改写为「真实 tid」，并重新生成 payload 以便下一轮推送（否则仍会用旧本地 tid 推送）
  if(Object.keys(tidMap).length){
    for(const d of locals){
      if(d.sectionId!==sec) continue;
      const p = d.data && d.data.parent;
      if(p!=null && p!=='' && tidMap[String(p)]!=null){
        d.data = Object.assign({}, d.data, { parent: String(tidMap[String(p)]) });
        if(d.realId){ d._op='update'; } else { d._op='create'; }
        d._dirty = true;
        const pay = sectionPayload(sec, d.data); delete pay.id;
        if(isPtaskKind(SECTIONS[sec]&&SECTIONS[sec].kind) && !isRealTid(d.data.tid)) delete pay.tid;
        d.payload = pay;
        await idbPut(d);
      }
    }
  }
  for(const d of locals){ if(d.realId && !remoteIds.has(d.realId) && !d._dirty) await idbDelete(d.key); } // 外部已删除
}
async function syncNow(){
  if(window._syncing) return;
  window._syncing = true; setSyncState('syncing');
  const errors = [];
  const pushDirty = async () => {
    const all = await idbAll();
    const dirty = all.filter(d=> d._dirty);
    for(const doc of dirty){
      try{
        const k = SECTIONS[doc.pushSection] && SECTIONS[doc.pushSection].kind;
        // ptask 子任务：父任务仍为本地临时 tid → 暂不可推送（后端按 tid 关联，父 tid 未知），留待父同步后下一轮再推
        if(isPtaskKind(k)){
          const p = doc.data && doc.data.parent;
          if(p!=null && p!=='' && !isRealTid(p)) continue;
        }
        if(doc._op==='delete'){ if(doc.realId) await _netDelete(doc.pushSection, doc.realId); await idbDelete(doc.key); }
        else if(doc._op==='create'){
          const r = await _netCreate(doc.pushSection, doc.payload);
          const realId = (r && r.id) || '';
          const oldKey = doc.key; doc.realId = realId; doc.id = realId || doc.id; doc.data = Object.assign({}, doc.data, { id: doc.id }); doc._dirty=false; doc._op='sync'; doc._ts=0; doc.key = lkey(doc.sectionId, doc.id);
          await idbDelete(oldKey); await idbPut(doc);
        } else { if(doc.realId) await _netUpdate(doc.pushSection, doc.realId, doc.payload); doc._dirty=false; doc._op='sync'; doc._ts=0; await idbPut(doc); }
      }catch(e){ errors.push((doc.pushSection||'')+'/'+doc._op+'：'+(e.message||e)); }
    }
  };
  try{
    // 多轮：推送 → 拉取(回写 tid 并修正子任务 parent) → 再推送被修正的子任务，直至无待推送
    let pass=0;
    while(pass<12){
      await pushDirty();
      const canonicalSet = new Set();
      Object.keys(SECTIONS).forEach(id=>{ if(!localExcluded(id) && sectionBacked(id)) canonicalSet.add(localSection(id)); });
      for(const sec of canonicalSet){
        try{
          const remote = await apiJson('/section/'+sec+'?full=1');
          await mergePull(sec, Array.isArray(remote)?remote:[]);
          _seeded[sec] = true;
        }catch(e){ errors.push('拉取 '+sec+'：'+(e.message||e)); }
      }
      const stillDirty = (await idbAll()).filter(d=> d._dirty).length;
      if(!stillDirty) break;
      pass++;
    }
  }catch(e){ errors.push('同步异常：'+(e.message||e)); }
  finally{ window._syncing = false; }
  updateSyncBadge(); setSyncState(errors.length ? 'error' : 'done');
  try{ await render(); }catch(e){}
  if(errors.length) alert('同步完成，但有 '+errors.length+' 项失败：\n'+errors.slice(0,6).join('\n'));
  return errors;
}
async function seedAll(){
  const ids = Object.keys(SECTIONS).filter(id=> !localExcluded(id) && sectionBacked(id));
  for(const id of ids){ try{ await ensureLocal(id); }catch(e){} }
  updateSyncBadge();
}
function dirtyCount(){ return new Promise(res=>{ if(!_dbOk) return res(0); idbAll().then(docs=> res(docs.filter(x=>x._dirty).length)).catch(()=>res(0)); }); }
async function updateSyncBadge(){
  const n = await dirtyCount();
  ['syncBadge','syncBadge2'].forEach(id=>{ const b=document.getElementById(id); if(b){ b.textContent=n; b.style.display = n>0?'inline-block':'none'; } });
  const lbl = document.getElementById('syncLabel'); if(lbl) lbl.textContent = n>0 ? ('待同步 '+n) : '同步';
  const lbl2 = document.getElementById('syncLabel2'); if(lbl2) lbl2.textContent = n>0 ? ('同步（'+n+' 项待推送）') : '立即同步';
  const info = document.getElementById('syncInfo'); if(info) info.textContent = n>0 ? ('有 '+n+' 项本地修改尚未推送到飞书，点击同步与飞书双向合并。') : '所有数据已缓存到浏览器本地，修改即时保存；点击同步与飞书双向合并。';
}
function setSyncState(state){
  ['syncBtn'].forEach(()=>{});

}

    }
  }
  return [id];
}

/* ---------- modal ---------- */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
function openModal(title, schema, values, onSave){
  values = values||{};
  let fields = [];
  schema.forEach(f=>{
    const v = values[f.key]!=null?values[f.key]:(f.default!=null?f.default:'');
    if(f.inline){
      const cv = values[f.key]!=null?values[f.key]:false;
      const html = `<label class="inline-chk"><input type="checkbox" data-k="${f.key}" ${cv?'checked':''}/> ${esc(f.label)}</label>`;
      if(fields.length){
        const prev = fields[fields.length-1];
        const inner = prev.replace(/^<div class="field">/, '').replace(/<\/div>$/, '');
        fields[fields.length-1] = `<div class="field time-field">${inner}${html}</div>`;
      }
      return;
    }
    if(f.type==='textarea'){ fields.push(`<div class="field"><label>${f.label}</label><textarea data-k="${f.key}">${esc(v)}</textarea></div>`); return; }
    if(f.type==='time'){
      const parts=String(v||'').split(':'); const hh=parts[0]||'', mm=parts[1]||'';
      let hOpts='', mOpts='';
      for(let h=0;h<24;h++) hOpts+=`<option ${String(h)===hh||pad(h)===hh?'selected':''}>${pad(h)}</option>`;
      for(let m=0;m<60;m++) mOpts+=`<option ${String(m)===mm||pad(m)===mm?'selected':''}>${pad(m)}</option>`;
      fields.push(`<div class="field"><label>${f.label}</label><div class="time-row"><select data-k="time_h">${hOpts}</select><span>:</span><select data-k="time_m">${mOpts}</select></div></div>`);
      return;
    }
    if(f.type==='select'){
      let opts = (f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
      if(f.addable) opts += `<option value="__add_new__">＋ 新增分类…</option>`;
      let extra = '';
      if(f.addable) extra = `<div class="add-row" id="addrow_${f.key}" style="display:none;margin-top:6px">
        <input type="text" id="addinp_${f.key}" placeholder="输入新分类名称" />
        <button class="btn mini" type="button" onclick="confirmAddOption('${f.key}','${f.dynamic}')">确定</button>
        <button class="btn soft mini" type="button" onclick="cancelAddOption('${f.key}')">取消</button>
      </div>`;
      fields.push(`<div class="field"><label>${f.label}</label><select data-k="${f.key}" onchange="onSelectChange('${f.key}')">${opts}</select>${extra}</div>`);
      return;
    }
    const min = f.min!=null?`min="${f.min}"`:'', max=f.max!=null?`max="${f.max}"`:'';
    const ph = f.placeholder?` placeholder="${esc(f.placeholder)}"`:'';
    if(f.type==='checkbox'){ fields.push(`<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-k="${f.key}" ${v?'checked':''}/> ${esc(f.label)}</label></div>`); return; }
    fields.push(`<div class="field"><label>${f.label}</label><input data-k="${f.key}" type="${f.type==='number'?'number':'text'}" value="${esc(v)}" ${min} ${max}${ph}/></div>`);
  });
  fields = fields.join('');
  modal.innerHTML = `<h3>${title}</h3>${fields}
    <div class="modal-ops">
      <button class="btn soft" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitModal()">保存</button>
    </div>`;
  modal._schema = schema; modal._onSave = onSave; modal._values = values;
  overlay.classList.add('show');
}
// 选择「＋ 新增分类…」时展开内联输入框
function onSelectChange(key){
  const row = document.getElementById('addrow_'+key);
  if(!row) return;
  const sel = modal.querySelector(`[data-k="${key}"]`);
  if(sel.value === '__add_new__'){ row.style.display='flex'; document.getElementById('addinp_'+key).focus(); }
  else row.style.display='none';
}
function cancelAddOption(key){
  const row = document.getElementById('addrow_'+key);
  if(row) row.style.display='none';
  const sel = modal.querySelector(`[data-k="${key}"]`);
  if(sel) sel.selectedIndex = 0;   // 恢复为第一个真实选项
}
async function confirmAddOption(key, dyn){
  const inp = document.getElementById('addinp_'+key);
  const name = (inp.value||'').trim();
  if(!name){ alert('请输入分类名称'); return; }
  try{
    const j = await apiJson('/'+dyn, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})});
    const opts = (j && j.options) || [];
    const sel = modal.querySelector(`[data-k="${key}"]`);
    // 重建下拉：保留全部真实选项 + 「新增分类」项，并选中刚新建的分类
    sel.innerHTML = opts.map(o=>`<option ${o===name?'selected':''}>${esc(o)}</option>`).join('') + `<option value="__add_new__">＋ 新增分类…</option>`;
    sel.value = name;
    const row = document.getElementById('addrow_'+key);
    if(row) row.style.display='none';
    inp.value='';
  }catch(e){ alert('新增分类失败：'+(e.message||e)); }

function closeModal(){ overlay.classList.remove('show'); modal.classList.remove('wide'); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
async function submitModal(){
  const schema = modal._schema, vals = modal._values;
  const out = Object.assign({}, vals);
  for(const f of schema){
    let v;
    if(f.type==='time'){
      const h=modal.querySelector('[data-k="time_h"]'), m=modal.querySelector('[data-k="time_m"]');
      v = (h&&m)? (pad(Number(h.value))+':'+pad(Number(m.value))) : '';
    } else {
      const el = modal.querySelector(`[data-k="${f.key}"]`);
      v = el.value;
      if(f.type==='number') v = v===''?0:Number(v);
      if(f.type==='checkbox') v = el.checked;
    }
    out[f.key]=v;
    if(f.required && !String(v).trim()){ alert('请填写：'+f.label); return; }
  }
  try{ await modal._onSave(out); }catch(e){ alert('保存失败：'+(e&&e.message||e)); return; }
  closeModal();
}

function genericBody(kind,it){
  const fields = SCHEMA[kind];
  let title = it.title || it.name || '(无标题)';
  let head = `<div class="it-title">${esc(title)}</div>`;
  let meta = '';
  fields.forEach(f=>{
    if(f.key==='title') return;
    let v = it[f.key]; if(v==null||v==='') return;
    if(f.key==='tags'){ meta += (v.split(',').map(t=>`<span class="chip">${esc(t.trim())}</span>`).join('')); return; }
    if(f.key==='content'||f.key==='detail'||f.key==='note'||f.key==='result'){ meta += `<div class="meta"><b>${f.label}：</b>${esc(v)}</div>`; return; }
    if(f.key==='link'){ const safe = esc(String(v).trim()); meta += `<div class="meta"><b>${f.label}：</b><a href="${safe}" target="_blank" rel="noopener">${safe}</a></div>`; return; }
    meta += `<div class="meta"><b>${f.label}：</b>${esc(v)}</div>`;
  });
  let prog = '';
  if(kind==='goals'){
    const p = Number(it.progress)||0;
    prog = `<div class="prog"><span style="width:${p}%"></span></div><div class="prog-label">${p}% 完成</div>`;
  }
  return head+meta+prog;
}
/* 灵感库卡片：展示核心字段 + 搜索高亮 + 命中片段（q 由调用方传入当前页搜索词） */
function hl(s, q){
  s = s||'';
  if(!q) return esc(s);
  const safe = esc(s);
  const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try { return safe.replace(new RegExp(qe,'gi'), x=>`<mark>${x}</mark>`); }
  catch(e){ return safe; }
}
// 命中片段：若命中词只藏在「关键词/AI总结/标签/分类」等卡片上看不到的字段，补一行片段让用户看清
function wisdomMatchInfo(it, q){
  q = (q||'').trim();
  if(!q) return {hit:true, snippet:''};
  const ql = q.toLowerCase();
  const fields = {
    title:(it.title||''), quote:(it.quote||''), keywords:(it.keywords||''),
    summary:(it.summary||''), tag:(it.tag||''), cat1:(it.cat1||''),
    cat2:(it.cat2||''), cat3:(it.cat3||'')
  };
  const hay = Object.values(fields).join(' ').toLowerCase();
  if(!hay.includes(ql)) return {hit:false};
  if(fields.title.toLowerCase().includes(ql) || fields.quote.toLowerCase().includes(ql)) return {hit:true, snippet:''};
  if(fields.summary.toLowerCase().includes(ql)){
    const i = fields.summary.toLowerCase().indexOf(ql);
    return {hit:true, snippet: fields.summary.slice(Math.max(0,i-12), i+ql.length+24)};
  }
  if(fields.keywords.toLowerCase().includes(ql)) return {hit:true, snippet: fields.keywords};
  return {hit:true, snippet: [fields.tag,fields.cat1,fields.cat2,fields.cat3].filter(Boolean).join(' / ')};
}
function wisdomBody(it, q){
  let h = `<div class="it-title">${hl(it.title||'(无标题)', q)}</div>`;
  let chips = '';
  if(it.cat1) chips += `<span class="chip cat">${esc(it.cat1)}</span>`;
  if(it.tag) chips += `<span class="chip tag">${esc(it.tag)}</span>`;
  if(it.ctype) chips += `<span class="chip type">${esc(it.ctype)}</span>`;
  if(chips) h += `<div class="chips">${chips}</div>`;
  if(it.quote) h += `<div class="quote">“${hl(it.quote, q)}”</div>`;
  const m = wisdomMatchInfo(it, q);
  if(q && m.snippet) h += `<div class="snippet">🔎 命中：<b>${esc(m.snippet)}</b></div>`;
  return h;
}

/* ---- 人生灵感库 / 知识库分类页：统一 分页懒加载 + 搜索 + 筛选 ---- */
const PG_SIZE = 20;
const pgState = {};   // sectionId -> {page,loading,done,q,cat1,cat2,tag,ctype,items,total,hasMore,facets}
let _infiniteScrollFn = null;
function pgGet(sectionId){
  if(!pgState[sectionId]) pgState[sectionId] = {page:0,loading:false,done:false,q:'',cat1:'',cat2:'',tag:'',ctype:'',status:'',items:[],total:0,hasMore:false,facets:{}};
  return pgState[sectionId];
}
async function fetchInspPage(sectionId, page){
  const st = pgGet(sectionId);
  await ensureLocal(sectionId);
  const sec = localSection(sectionId);
  let list = (await idbAll()).filter(d=> d.sectionId===sec && d._op!=='delete').map(d=>d.data);
  if(sec==='inspiration' && sectionId!=='inspiration'){
    const tag = SECTIONS[sectionId] && SECTIONS[sectionId].name; list = list.filter(x=> (x.tag||'')===tag);
  }
  const q = (st.q||'').trim();
  if(q) list = list.filter(it=> inspMatchLocal(it, q));
  if(st.cat1) list = list.filter(it=> it.cat1===st.cat1);
  if(st.cat2) list = list.filter(it=> it.cat2===st.cat2);
  if(st.tag)  list = list.filter(it=> it.tag===st.tag);
  if(st.ctype) list = list.filter(it=> it.ctype===st.ctype);
  if(st.status) list = list.filter(it=> it.status===st.status);
  list.sort((a,b)=> String(b.id).localeCompare(String(a.id)) );
  const total = list.length;
  const pageSize = PG_SIZE;
  const start = (page-1)*pageSize;
  const items = list.slice(start, start+pageSize).map(slimLocal);
  const facets = { cat1: inspFacetLocal(list,'cat1'), cat2: inspFacetLocal(list,'cat2'), tag: inspFacetLocal(list,'tag'), ctype: inspFacetLocal(list,'ctype') };
  return { items, total, page, pageSize, hasMore: start+pageSize<total, facets };
}
async function renderInspirationSection(sectionId){
  const st = pgGet(sectionId);
  st.page=0; st.items=[]; st.done=false; st.loading=false;   // 进入/刷新时重置，重新拉第一页
  const s = SECTIONS[sectionId];

function inspToolbar(sectionId){
  const st = pgGet(sectionId);
  const f = st.facets || {};
  const opt = (key, selVal)=> `<option value="">全部</option>` + (f[key]||[]).map(v=>`<option ${v===selVal?'selected':''}>${esc(v)}</option>`).join('');
  return `<div class="wisdom-toolbar">

      <button class="btn" onclick="inspSearch('${sectionId}',document.getElementById('inspQ_${sectionId}').value)">搜索</button>

    ${sectionId==='inspiration' ? `<select onchange="inspSet('${sectionId}','status',this.value)"><option value="">是否整理：全部</option><option value="未整理" ${st.status==='未整理'?'selected':''}>未整理</option><option value="已整理" ${st.status==='已整理'?'selected':''}>已整理</option></select>` : ''}
    <button class="btn soft mini" onclick="inspReset('${sectionId}')">重置</button>
  </div>`;

async function loadMoreInsp(sectionId, isReset){
  const st = pgGet(sectionId);
  if(!document.getElementById('inspGrid')) return;   // 已切换到其它页面，放弃
  if(st.loading || st.done) return;
  st.loading = true;
  const loader = document.getElementById('inspLoader'); if(loader) loader.style.display='block';
  try{
    const data = await fetchInspPage(sectionId, st.page + 1);
    st.facets = data.facets || st.facets || {};
    const tw = document.getElementById('inspToolbarWrap'); if(tw) tw.innerHTML = inspToolbar(sectionId);
    st.items = isReset ? data.items.slice() : st.items.concat(data.items);
    st.page = data.page; st.total = data.total; st.hasMore = data.hasMore; st.done = !data.hasMore;
    renderInspGrid(sectionId);
  }catch(e){ alert('加载失败：'+(e.message||e)); }
  finally{
    st.loading = false;
    const l2 = document.getElementById('inspLoader'); if(l2) l2.style.display='none';
  }
  // 内容不足一屏却还有更多 → 继续加载（避免滚不动就拿不到后续数据）
  if(st.hasMore && !st.done && document.documentElement.scrollHeight <= window.innerHeight + 60){
    setTimeout(()=> loadMoreInsp(sectionId, false), 60);
  }
}
function renderInspGrid(sectionId){
  const st = pgGet(sectionId);

  const s = SECTIONS[sectionId];

  const end = document.getElementById('inspEnd'); if(end) end.style.display = (st.done && st.items.length) ? 'block' : 'none';
}
function setupInspScroll(sectionId){
  if(_infiniteScrollFn){ window.removeEventListener('scroll', _infiniteScrollFn); _infiniteScrollFn = null; }
  _infiniteScrollFn = ()=>{
    if(!document.getElementById('inspGrid')) return;   // 离开了灵感库类页面
    const st = pgGet(sectionId);
    if(st.loading || st.done) return;
    if((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 500)) loadMoreInsp(sectionId, false);
  };

}

function inspSet(sectionId, k, v){ const st=pgGet(sectionId); st[k]=v; renderInspirationSection(sectionId); }
function inspReset(sectionId){ const st=pgGet(sectionId); st.q='';st.cat1='';st.cat2='';st.tag='';st.ctype='';st.status=''; renderInspirationSection(sectionId); }

async function editWisdom(recId, sectionId){
  sectionId = sectionId || 'inspiration';
  const sec = localSection(sectionId);

  try{
    const docs = (await idbAll()).filter(d=> d.key===lkey(sec, recId));
    it = docs[0] ? docs[0].data : null;
  }catch(e){}
  if(!it || !it.id) { alert('未找到该记录，可能已被删除'); return; }
  const cat = await getCategory();
  const tree = cat.tree||{};
  const cur1 = it.cat1||'', cur2 = it.cat2||'', cur3 = it.cat3||'';
  const list2 = tree[cur1] ? Object.keys(tree[cur1]) : [];
  const list3 = (tree[cur1]&&tree[cur1][cur2]) ? tree[cur1][cur2] : [];
  const sel = (k,label,opts,cur)=> `<div class="field"><label>${label}</label><select data-k="${k}">${optList(opts,cur)}</select></div>`;

  const noteVal = item ? (item.note || '') : '';
  const titleOpts = ['<option value="">（新建自定义标题）</option>'].concat(

  const dailyChk = dailyVal === '否' ? '' : 'checked';
